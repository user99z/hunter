<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
/* Sincroniza o primeiro frame da PWA com o tema salvo, antes do CSS pintar a tela. */
(function(){
  try {
    var dark = localStorage.getItem("meuQuizTema") === "dark";
    var surface = dark ? "#17130E" : "#F5F1EA";
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    document.documentElement.style.colorScheme = dark ? "dark" : "light";
    document.documentElement.style.background = surface;
  } catch(e) {}
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏹</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hunter">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Hunter">
<meta name="format-detection" content="telephone=no">
<title>Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter+Tight:wght@400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Manrope:wght@400;500;600;700&family=Merriweather:opsz,wght@18..144,400;18..144,500;18..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&display=swap" rel="stylesheet">
<style>
body>h1,body>p.meta,.toolbar,.question-nav,.answer,.answer-key{display:none!important}

:root{
  --fs:1;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --primary:#7C2D12;
  --on-primary:#FBF8F3;
  --primary-container:#F0E4DC;
  --on-primary-container:#3D1408;
  --surface:#F5F1EA;
  --on-surface:#1C1917;
  --on-surface-variant:#57534E;
  --surface-container:#EDE8DE;
  --surface-container-high:#E2DCCF;
  --outline:#8B8173;
  --outline-variant:#D6CFC1;
  --error:#991B1B;
  --error-container:#F5E3E3;
  --on-error-container:#4A0E0E;
  --success:#4D7C0F;
  --success-container:#EBF0E0;
  --on-success-container:#1F330A;
  --warn:#92400E;
  --warn-container:#F5EAE0;
  --overdue:#7F1D1D;
  --ink-subtle:#A8A29E;
  --rule:#D6CFC1;
  --rule-strong:#B8AE9C;
  --paper-raised:#FBF8F3;
  --paper-sunken:#EDE8DE;
  --sidebar-w:260px;
  --radius-sm:3px;
  --radius:5px;
  --radius-lg:8px;
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --font-body:'Inter Tight',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="dark"]{
  --primary:#C2410C;
  --on-primary:#FBF8F3;
  --primary-container:#3A1810;
  --on-primary-container:#F5D6C8;
  --surface:#17130E;
  --on-surface:#F5F1EA;
  --on-surface-variant:#A8A29E;
  --surface-container:#1F1B15;
  --surface-container-high:#2A251D;
  --outline:#6B6357;
  --outline-variant:#3C342A;
  --error:#EF5350;
  --error-container:#3E1F1F;
  --on-error-container:#FFD9D6;
  --success:#84CC16;
  --success-container:#1E2A0E;
  --on-success-container:#D5E8B5;
  --warn:#FBBF24;
  --warn-container:#3F2D0A;
  --overdue:#B91C1C;
  --ink-subtle:#7A7369;
  --rule:#3C342A;
  --rule-strong:#4E453A;
  --paper-raised:#1F1B15;
  --paper-sunken:#120F0B;
}
:root[data-theme="dark"]{background:#17130E}
:root{background:#F5F1EA}

*{box-sizing:border-box}
html{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}
body{
  background:var(--surface);
  color:var(--on-surface);
  margin:0;
  font-family:var(--font-body);
  overflow-x:hidden;
  min-height:100vh;
  line-height:1.5;
  padding-top:calc(52px + env(safe-area-inset-top, 0px));
  -webkit-text-size-adjust:100%;
}
@media(min-width:901px){ body{padding-left:var(--sidebar-w)} }
body.study-mode{padding-left:0;padding-top:0}

button,a,input,select,textarea,[data-haction]{touch-action:manipulation}

h1,h2,.hero-title,.display,.brand-mark{
  font-family:var(--font-display);
  font-weight:500;
  letter-spacing:-0.012em;
  font-variant-numeric:tabular-nums;
}

:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--radius-sm)}

.section-head-row{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.section-head-row .block{flex:1 1 260px;min-width:0}
.section-head-row .label{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-subtle)}
.section-head-row .title{font-family:var(--font-display);font-size:1.35rem;font-weight:500;color:var(--on-surface);letter-spacing:-0.015em;margin-top:4px}
.section-head-row .desc{font-family:var(--font-display);font-size:1rem;color:var(--on-surface-variant);line-height:1.65;margin:10px 0 0;max-width:640px}
.section-head-row .cta{flex-shrink:0}
.kpi-margin{margin-top:22px}
.progress-bar-track{height:8px;background:var(--rule);overflow:hidden;display:flex}
.progress-bar-track>div{height:100%}
.meta-bar-labels{display:flex;gap:16px;margin-top:10px;font-size:.8rem;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.bar-track{height:8px;background:var(--rule);overflow:hidden}
.bar-track>div{height:100%}
.gauge-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.gauge-row .v{font-family:var(--font-display);font-size:1.1rem;font-weight:600;color:var(--success)}
.gauge-row .v .sub{font-size:.75rem;font-weight:500;color:var(--on-surface-variant)}

/* ============ SIDEBAR ============ */
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);z-index:100001;display:block;padding-top:env(safe-area-inset-top,0px)}
#sidebar .sidebar-inner{position:relative;z-index:2;width:100%;height:100%;background:var(--paper-sunken);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow-y:auto}
.sidebar-brand{padding:26px 24px 22px;border-bottom:1px solid var(--rule);display:flex;align-items:baseline;gap:10px;flex-shrink:0}
.sidebar-brand .brand-mark{font-size:1.55rem;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.sidebar-brand .brand-name{font-size:1.2rem;font-weight:600;color:var(--on-surface);letter-spacing:-0.015em}
.sidebar-brand .brand-sub{margin-left:auto;font-family:var(--font-body);font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-subtle)}
.sidebar-nav{flex:1;padding:18px 10px 12px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 14px;border-radius:var(--radius);font-size:.88rem;color:var(--on-surface-variant);cursor:pointer;border:none;background:transparent;font-family:var(--font-body);text-align:left;width:100%;transition:background .12s,color .12s;font-weight:500;letter-spacing:-0.005em;line-height:1.3}
.nav-item:hover{background:var(--surface-container);color:var(--on-surface)}
.nav-item.ativo{background:var(--primary);color:var(--on-primary);font-weight:600}
.nav-item .nav-icon{flex-shrink:0;opacity:.75;display:block;width:16px;height:16px}
.nav-item.ativo .nav-icon{opacity:1}
.nav-group-toggle{position:relative}
.nav-chevron{margin-left:auto;font-size:1.1rem;line-height:1;color:var(--ink-subtle);transition:transform .22s ease;font-weight:400;display:inline-block;transform:rotate(0deg)}
.nav-chevron.open{transform:rotate(90deg)}
.nav-group-toggle.ativo .nav-chevron{color:var(--on-primary)}
.nav-submenu{max-height:0;overflow:hidden;transition:max-height .28s ease;display:flex;flex-direction:column;gap:1px;padding-left:6px}
.nav-submenu.open{max-height:520px}
.nav-subitem{padding-left:30px;font-size:.84rem;font-weight:500}
.sidebar-footer{padding:14px;border-top:1px solid var(--rule);flex-shrink:0}
.sidebar-credit{text-align:center;font-size:.72rem;color:var(--ink-subtle);letter-spacing:.04em;font-weight:500;padding:8px 4px;font-family:var(--font-body)}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(28,25,23,.45);z-index:1;opacity:0;pointer-events:none;transition:opacity .2s}
:root[data-theme="dark"] .sidebar-backdrop{background:rgba(0,0,0,.65)}
#sidebar.aberto .sidebar-backdrop{opacity:1;pointer-events:auto}
@media(max-width:900px){
  #sidebar{pointer-events:none}
  #sidebar.aberto{pointer-events:auto}
  #sidebar .sidebar-inner{transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);pointer-events:auto}
  #sidebar.aberto .sidebar-inner{transform:translateX(0);box-shadow:12px 0 40px rgba(0,0,0,.18)}
}

/* ============ TOPBAR ============ */
#plataforma-topbar{position:fixed;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:env(safe-area-inset-top,0px) 22px 0;height:calc(52px + env(safe-area-inset-top,0px));z-index:99999}
@media(min-width:901px){ #plataforma-topbar{padding-left:calc(var(--sidebar-w) + 22px)} }
.topbar-left{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-actions{display:flex;gap:6px;align-items:center}
.topbar-hamburger{background:transparent;border:none;color:var(--on-surface);width:36px;height:36px;border-radius:var(--radius);cursor:pointer;display:none;align-items:center;justify-content:center;transition:background .12s;padding:0}
.topbar-hamburger:hover{background:var(--surface-container)}
.topbar-hamburger svg{display:block}
@media(max-width:900px){ .topbar-hamburger{display:flex} }
.topbar-breadcrumb{font-size:.83rem;color:var(--on-surface-variant);display:flex;align-items:center;gap:8px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.topbar-breadcrumb .crumb-sep{color:var(--ink-subtle);font-size:.7rem}
.topbar-breadcrumb .crumb-current{color:var(--on-surface);font-weight:600;font-family:var(--font-display);font-size:.95rem;letter-spacing:-0.005em}
.btn-topbar{background:transparent;border:1px solid transparent;color:var(--on-surface-variant);padding:7px 12px;border-radius:var(--radius);font-size:.82rem;font-weight:500;cursor:pointer;font-family:var(--font-body);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .12s}
.btn-topbar:hover{background:var(--surface-container);color:var(--on-surface);border-color:var(--rule)}
.btn-sync-indicator{padding:6px 10px;font-size:1rem;line-height:1;min-width:36px;justify-content:center}
.btn-sync-indicator .sync-dot{display:inline-block;line-height:1;transition:transform .2s}
.btn-sync-indicator.syncing .sync-dot{animation:sync-spin 1.2s linear infinite}
.btn-sync-indicator.syncing{border-color:var(--primary)}
@keyframes sync-spin{to{transform:rotate(360deg)}}

/* ============ HOME / HERO ============ */
#home{position:fixed;inset:0;background:var(--surface);z-index:99998;overflow-y:auto;display:none;padding-top:calc(52px + env(safe-area-inset-top,0px));-webkit-overflow-scrolling:touch;height:100dvh}
#home.aberto{display:block}
@media(min-width:901px){ #home{padding-left:var(--sidebar-w)} }
.home-inner{max-width:920px;margin:0 auto;padding:16px 24px calc(120px + env(safe-area-inset-bottom,0px))}
@media(max-width:900px){.home-inner{padding:12px 16px calc(100px + env(safe-area-inset-bottom,0px))}}
.hero{padding:32px 0 24px;border-bottom:1px solid var(--rule);margin-bottom:32px}
.hero-date{font-family:var(--font-body);font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-subtle);margin-bottom:10px;display:block}
.hero-title{font-family:var(--font-display);font-size:2.1rem;font-weight:500;margin:0 0 14px;line-height:1.2;letter-spacing:-0.02em;color:var(--on-surface);display:block}
.hero-title .hero-greeting{display:inline}
.hero-title .streak-inline{display:inline-block;vertical-align:middle;margin-left:12px;transform:translateY(-3px);font-family:var(--font-body);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);background:var(--warn-container);padding:4px 11px;border-radius:999px;border:1px solid var(--warn)}
.hero-motivation{font-family:var(--font-display);font-size:1.02rem;color:var(--on-surface-variant);line-height:1.6;margin:0;max-width:640px}
@media(max-width:600px){
  .hero{padding:22px 0 18px;margin-bottom:22px}
  .hero-title{font-size:1.65rem}
  .hero-motivation{font-size:.95rem}
}

/* ============ SECTIONS ============ */
.home-section{background:transparent;border:none;border-top:1px solid var(--rule);border-radius:0;padding:26px 0;margin-bottom:0}
.home-section[data-flat="1"]{border-top:none;padding-top:0}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.section-head .label{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-subtle)}
.section-head .title{font-family:var(--font-display);font-size:1.35rem;font-weight:500;color:var(--on-surface);letter-spacing:-0.015em;margin-top:4px}
.section-head .action{flex-shrink:0}
.kpi-line{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:14px 0}
.kpi-line .kpi{display:inline-flex;align-items:baseline;gap:6px}
.kpi-line .kpi .v{font-family:var(--font-display);font-size:1.35rem;font-weight:500;color:var(--on-surface);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.kpi-line .kpi .l{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-subtle)}
.kpi-line .kpi .v.ok{color:var(--success)}
.kpi-line .kpi .v.er{color:var(--error)}
.kpi-line .kpi .v.over{color:var(--overdue)}
.kpi-line .kpi .v.wr{color:var(--warn)}
.kpi-line .kpi .v.pr{color:var(--primary)}
.overview-actions{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius);padding:22px 24px}
.overview-action-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.overview-action-title{font-family:var(--font-display);font-size:1.3rem;font-weight:500;line-height:1.25;color:var(--on-surface)}
.overview-action-desc{font-family:var(--font-display);font-size:.96rem;color:var(--on-surface-variant);line-height:1.55;margin:5px 0 0}
.overview-count{background:var(--primary-container);color:var(--on-primary-container);border:1px solid var(--rule);border-radius:var(--radius);padding:5px 10px;font-size:.75rem;font-weight:700;white-space:nowrap}
.overview-actions-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:17px}
.overview-study{margin:0;padding:0}
.overview-resume{border-top:1px solid var(--rule);margin-top:22px;padding-top:19px}
.overview-goal{border-top:1px solid var(--rule);margin-top:22px;padding-top:19px}
.overview-study-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.overview-study-title{font-family:var(--font-display);font-size:1.2rem;font-weight:500;color:var(--on-surface)}
.overview-study-hint{font-size:.75rem;color:var(--ink-subtle)}
.overview-study-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.overview-study-btn{width:100%;min-width:0;white-space:normal;text-align:left;justify-content:flex-start;padding:10px 13px}
.overview-study-btn .overview-action-icon{width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:var(--radius);background:var(--primary-container);color:var(--on-primary-container);font-size:1.05rem}
.overview-study-btn .overview-action-copy{min-width:0}
.overview-study-btn strong{display:block;font-size:.83rem}
.overview-study-btn small{display:block;color:var(--on-surface-variant);font-size:.72rem;font-weight:400;white-space:normal;margin-top:1px}
.overview-stats{padding:0;margin:0}
.overview-stats-title{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-subtle);margin-bottom:12px}
.overview-stats-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.overview-stat{border-right:1px solid var(--rule);padding-right:10px;min-width:0}
.overview-stat:last-child{border-right:0}
.overview-stat-value{font-family:var(--font-display);font-size:1.45rem;line-height:1.15;font-weight:500;font-variant-numeric:tabular-nums;color:var(--on-surface)}
.overview-stat-label{display:block;color:var(--ink-subtle);font-size:.63rem;line-height:1.35;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
.overview-stat-value.ok{color:var(--success)}.overview-stat-value.over{color:var(--overdue)}.overview-stat-value.wr{color:var(--warn)}
@media(max-width:600px){.overview-actions{padding:18px 16px}.overview-study-actions{grid-template-columns:1fr}.overview-study-head{display:block}.overview-study-hint{display:block;margin-top:2px}.overview-stats-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px 9px}.overview-stat{border:0;padding:0}.overview-stat-value{font-size:1.35rem}.overview-stat-label{font-size:.58rem}}
.card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius);padding:20px 22px;margin-bottom:12px;transition:border-color .15s}
.card:hover{border-color:var(--rule-strong)}
.empty-state{color:var(--on-surface-variant);font-size:.9rem;text-align:center;padding:32px 20px;background:transparent;border-radius:0;border:1px dashed var(--rule);font-family:var(--font-display);font-style:italic}
.smallcaps{font-size:.68rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-subtle)}
.muted{color:var(--on-surface-variant)}

/* ============ DISCIPLINA / TEMA ============ */
.discipline-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
@media(max-width:560px){.discipline-grid{grid-template-columns:1fr}}
.disc-tile{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:all .15s;display:flex;gap:14px;align-items:flex-start;text-align:left;font-family:inherit;min-width:0}
.disc-tile:hover{border-color:var(--rule-strong);background:var(--paper-sunken)}
.disc-tile .disc-tile-title{font-family:var(--font-display);font-size:1.05rem;font-weight:500;color:var(--on-surface);margin:0;letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disc-tile .disc-tile-meta{font-size:.78rem;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.disc-tile .bar{height:2px;background:var(--rule);overflow:hidden;margin-top:6px}
.disc-tile .bar .fill{height:100%;background:var(--success);transition:width .3s}
.disc-tile .bar .fill.warn{background:var(--warn)}
.disc-tile .bar .fill.danger{background:var(--error)}
.disc-tile .row{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-subtle);gap:8px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.disc-tile .review-pill{background:transparent;color:var(--overdue);font-size:.7rem;font-weight:700;padding:3px 0;letter-spacing:.06em;text-transform:uppercase}
.disc-tile .sel-cb{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;display:block;border-radius:2px}
.theme-list{display:flex;flex-direction:column;gap:0}
.theme-row{background:transparent;border:none;border-bottom:1px solid var(--rule);border-radius:0;padding:14px 4px;display:flex;align-items:center;gap:14px;cursor:pointer;font-family:inherit;text-align:left;width:100%;transition:background .12s;min-width:0;flex-wrap:wrap}
.theme-row:hover{background:var(--surface-container)}
.theme-row.selecionada{background:var(--primary-container)}
.theme-row .theme-info{flex:1;min-width:0}
.theme-row .theme-name{font-family:var(--font-display);font-weight:500;color:var(--on-surface);margin:0 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1rem;letter-spacing:-0.01em}
.theme-row .theme-meta{font-size:.76rem;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.theme-row .theme-rate{font-family:var(--font-display);font-weight:600;font-size:1.2rem;flex-shrink:0;margin-left:auto;font-variant-numeric:tabular-nums}
.theme-row .theme-rate.good{color:var(--success)}
.theme-row .theme-rate.warn{color:var(--warn)}
.theme-row .theme-rate.bad{color:var(--error)}
.theme-row .theme-rate.empty{color:var(--ink-subtle);font-weight:400;font-size:.9rem}
.theme-row .sel-cb{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;display:block}

/* ============ BOTÕES ============ */
.btn-primary,.btn-secondary,.btn-danger,.btn-responder{font-family:var(--font-body);border-radius:var(--radius);padding:10px 18px;font-size:.84rem;font-weight:600;letter-spacing:-0.005em;cursor:pointer;white-space:nowrap;transition:all .12s;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn-primary:hover:not(:disabled){background:#5E2110;border-color:#5E2110}
:root[data-theme="dark"] .btn-primary:hover:not(:disabled){background:#A8360B;border-color:#A8360B}
.btn-primary:disabled{background:var(--surface-container-high);color:var(--ink-subtle);border-color:var(--rule);cursor:not-allowed}
.btn-secondary{background:transparent;color:var(--on-surface);border-color:var(--rule)}
.btn-secondary:hover:not(:disabled){background:var(--surface-container);border-color:var(--rule-strong)}
.btn-secondary:disabled{opacity:.45;cursor:not-allowed}
.btn-danger{background:var(--error);color:#fff;border-color:var(--error)}
.btn-danger:hover:not(:disabled){background:#7A1717}
.btn-danger.overdue{background:var(--overdue)}
.btn-icon-sm{background:transparent;border:1px solid var(--rule);width:30px;height:30px;border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;transition:all .12s;color:var(--on-surface-variant);padding:0;line-height:1;font-family:inherit}
.btn-icon-sm:hover{background:var(--surface-container);border-color:var(--rule-strong);color:var(--on-surface)}
.btn-icon-sm.danger:hover{background:var(--error-container);border-color:var(--error);color:var(--error)}
.back-btn{background:transparent;border:1px solid var(--rule);color:var(--on-surface-variant);border-radius:var(--radius);font-size:.78rem;font-weight:600;cursor:pointer;padding:7px 12px;font-family:var(--font-body);margin-bottom:16px;display:inline-flex;align-items:center;gap:6px;transition:all .12s;letter-spacing:-0.005em;text-transform:uppercase}
.back-btn:hover{background:var(--surface-container);color:var(--on-surface);border-color:var(--rule-strong)}

/* ============ QUESTÃO ============ */
main.questions-container{max-width:1100px;margin:28px auto;padding:0 24px}
body.study-mode main.questions-container{margin:0 auto;padding:70px 24px 40px}
@media(max-width:900px){main.questions-container{padding:0 14px;margin:18px auto}
  body.study-mode main.questions-container{margin:0 auto;padding:62px 14px 32px}}
.separador-material,.separador-tema{display:none}
.question{width:100%;position:relative;background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius);padding:32px 36px;margin:0 auto;max-width:1100px}
@media(max-width:900px){.question{padding:22px 18px}}
/* Header da questão (título + bandeira) */
.q-header{display:flex;align-items:flex-start;gap:12px;margin:0 0 16px;position:relative}
.q-heading{display:flex;align-items:center;flex-wrap:wrap;gap:8px;flex:1;min-width:0;min-height:28px}
.q-header h2{flex:0 1 auto;min-width:0;max-width:100%;overflow-wrap:anywhere;margin:0;padding:0}
.question h2{font-family:var(--font-body);font-size:calc(.65rem * var(--fs,1));margin:0;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--on-surface);line-height:1.3}
/* Bandeira da questão */
.q-flag-btn{position:static;flex:0 0 28px;background:transparent;border:1px solid var(--rule-strong);width:28px;height:28px;min-width:28px;min-height:28px;aspect-ratio:1/1;border-radius:50%;box-sizing:border-box;color:var(--on-surface-variant);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;padding:0;font-size:.9rem;line-height:1;font-family:inherit}
.q-flag-btn:hover{background:var(--warn-container);border-color:var(--warn);color:var(--warn)}
.q-flag-btn.ativo{background:var(--warn);border-color:var(--warn);color:#fff}
.statement{font-family:var(--font-display);font-size:calc(1.12rem * var(--fs,1));line-height:1.75;margin-bottom:28px;text-align:justify;color:var(--on-surface);letter-spacing:-0.005em}
@media(max-width:900px){.statement{text-align:justify;text-align-last:left;hyphens:auto;-webkit-hyphens:auto}}
.alternatives{padding:0;margin:0;border-top:1px solid var(--rule);padding-top:22px;display:flex;flex-direction:column;gap:8px;list-style:none}
.alternative{display:flex;align-items:flex-start;padding:14px 16px;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;transition:all .15s;background:transparent;color:var(--on-surface);font-size:calc(1rem * var(--fs,1));line-height:1.55;text-align:left;gap:14px;border-left:2px solid var(--rule);width:100%;font-family:inherit}
.alternative:hover{background:var(--surface-container);border-left-color:var(--rule-strong)}
.letter{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:transparent;border:1px solid var(--rule-strong);font-weight:700;color:var(--on-surface-variant);flex-shrink:0;font-size:.72rem;font-family:var(--font-body);margin-top:1px}
.alt-content{flex:1 1 auto;min-width:0;padding-right:4px}
.alt-content img{max-width:100%;height:auto;border-radius:var(--radius);display:block;margin-top:10px;cursor:zoom-in}
.alternative.selecionada{background:var(--primary-container);border-left:2px solid var(--primary);color:var(--on-primary-container)}
.alternative.selecionada .letter{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.question.respondida .alternative{cursor:default;pointer-events:none}
.alternative.acertou{border-left:2px solid var(--success);background:var(--success-container);color:var(--on-success-container)}
.alternative.acertou .letter{background:var(--success);color:#fff;border-color:var(--success)}
.alternative.errou{border-left:2px solid var(--error);background:var(--error-container);color:var(--on-error-container)}
.alternative.errou .letter{background:var(--error);color:#fff;border-color:var(--error)}
.alternative.gabarito{border-left:2px solid var(--success);background:var(--success-container);color:var(--on-success-container);font-weight:500}
.alternative.gabarito .letter{background:var(--success);color:#fff;border-color:var(--success)}
:root[data-theme="dark"] .alternative.acertou .letter,:root[data-theme="dark"] .alternative.gabarito .letter{color:#141414}
.alternative.eliminada{opacity:.45;background:transparent;border-left:2px dashed var(--rule);text-decoration:line-through}
.alternative.eliminada .letter{background:transparent;color:var(--ink-subtle);border-color:var(--rule)}
.elim-btn{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule-strong);background:transparent;color:var(--on-surface-variant);font-size:.95rem;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85;transition:all .15s;font-family:inherit;padding:0}
.elim-btn:hover{background:var(--error-container);border-color:var(--error);color:var(--error);opacity:1}
.alternative.eliminada .elim-btn{background:var(--on-surface-variant);border-color:var(--on-surface-variant);color:var(--surface);text-decoration:none;opacity:1}
.question.respondida .elim-btn{display:none}
.action-area{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid var(--rule);padding-top:20px;width:100%}
.btn-responder{background:var(--primary);color:var(--on-primary);padding:12px 26px;font-size:.85rem;margin-left:auto}
.btn-responder:disabled{background:var(--surface-container-high);color:var(--ink-subtle);cursor:not-allowed;opacity:1}
.btn-responder:not(:disabled):hover{background:#5E2110}
:root[data-theme="dark"] .btn-responder:not(:disabled):hover{background:#A8360B}
.feedback-text{font-family:var(--font-display);font-weight:500;font-size:calc(.95rem * var(--fs,1));display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.feedback-text.sucesso{color:var(--success)}
.feedback-text.erro{color:var(--error)}
.feedback-text.info{color:var(--on-surface-variant)}
.confidence-area{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.btn-conf{padding:11px 20px;border-radius:var(--radius);border:1px solid;background:transparent;font-weight:600;font-size:.84rem;cursor:pointer;font-family:var(--font-body);white-space:nowrap;transition:all .12s}
.btn-conf-sure{border-color:var(--success);color:var(--success)}
.btn-conf-sure:hover{background:var(--success-container)}
.btn-conf-unsure{border-color:var(--warn);color:var(--warn)}
.btn-conf-unsure:hover{background:var(--warn-container)}
.resolucao-area{margin-top:20px;width:100%}
.resolucao-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.resolucao-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-subtle);font-weight:700;margin-right:4px}
.btn-resolucao{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;font-size:.82rem;font-weight:500;font-family:var(--font-body);background:transparent;color:var(--on-surface);border:1px solid var(--rule);border-radius:var(--radius);cursor:pointer;text-decoration:none;line-height:1;white-space:nowrap;transition:all .12s}
.btn-resolucao:hover{background:var(--surface-container);border-color:var(--rule-strong)}
.btn-resolucao.ativo{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.resolucao-pane{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius);padding:22px 24px;line-height:1.7;font-family:var(--font-display);font-size:calc(1.02rem * var(--fs,1));color:var(--on-surface);text-align:left;word-break:break-word;overflow-wrap:break-word}
.resolucao-pane[hidden]{display:none}
.resolucao-pane img{max-width:100%;height:auto;border-radius:var(--radius);display:block;margin:12px auto 0}
.resolucao-pane video{width:100%;border-radius:var(--radius);background:#000;max-height:400px;display:block}
.question img{max-width:100%;height:auto;border-radius:var(--radius);cursor:zoom-in;display:block;margin:12px auto 0}
.q-sr-badge{position:static;display:inline-flex;align-items:center;justify-content:center;min-height:26px;max-width:100%;box-sizing:border-box;overflow-wrap:anywhere;font-size:calc(.6rem * var(--fs,1));font-weight:700;padding:5px 10px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase;white-space:normal;font-family:var(--font-body);border:1px solid transparent;line-height:1.15}
.q-sr-badge.novo{background:var(--surface-container);color:var(--ink-subtle);border-color:var(--rule)}
.q-sr-badge.overdue{background:var(--overdue);color:#fff;border-color:var(--overdue)}
.q-sr-badge.due{background:var(--error);color:#fff;border-color:var(--error)}
.q-sr-badge.scheduled{background:var(--surface);color:var(--primary);border-color:var(--primary)}
.q-sr-badge.mastered{background:var(--success);color:#fff;border-color:var(--success)}
.q-sr-badge.pending{background:var(--warn-container);color:var(--warn);border-color:var(--warn)}

/* ============ MISC ============ */
.rank-row{display:flex;align-items:center;gap:14px;padding:14px 4px;background:transparent;border:none;border-bottom:1px solid var(--rule);border-radius:0;margin-bottom:0;cursor:pointer;transition:background .12s}
.rank-row:hover{background:var(--surface-container)}
.rank-row .pos{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;flex-shrink:0;background:transparent;color:var(--ink-subtle);border:1px solid var(--rule);font-variant-numeric:tabular-nums}
.rank-row.top .pos{background:var(--success);color:#fff;border-color:var(--success)}
.rank-row.bad .pos{background:var(--error);color:#fff;border-color:var(--error)}
.rank-row .info{flex:1;min-width:0}
.rank-row .name{font-family:var(--font-display);font-weight:500;font-size:.98rem;color:var(--on-surface);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.rank-row .meta{font-size:.72rem;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.rank-row .bar{height:2px;background:var(--rule);overflow:hidden;margin-top:6px}
.rank-row .bar .fill{height:100%;transition:width .3s}
.rank-row .rate{font-family:var(--font-display);font-weight:600;font-size:1.05rem;flex-shrink:0;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.review-chart{display:flex;gap:4px;align-items:flex-end;height:170px;padding:10px 0;overflow-x:auto;border-bottom:1px solid var(--rule);-webkit-overflow-scrolling:touch}
.review-chart .bar{flex:1;min-width:36px;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.review-chart .bar-count{font-size:.72rem;font-weight:700;color:var(--on-surface);line-height:1;font-variant-numeric:tabular-nums}
.review-chart .bar-fill{width:100%;border-radius:0;min-height:3px}
.review-chart .bar-fill.overdue{background:var(--overdue)}
.review-chart .bar-fill.today{background:var(--error)}
.review-chart .bar-fill.future{background:var(--primary)}
.review-chart .bar-fill.empty{background:var(--rule)}
.review-chart .bar-label{font-size:.66rem;color:var(--ink-subtle);white-space:nowrap;font-weight:600;letter-spacing:.02em}
.review-chart .bar-label .lbl-short{display:none}
.evolution-chart{width:100%;height:180px;display:block}
.achiev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:20px}
.achiev-card{background:transparent;border:1px solid var(--rule);border-radius:var(--radius);padding:18px 14px;text-align:center;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.achiev-card.locked{opacity:.55;filter:grayscale(.7)}
.achiev-card.unlocked{opacity:1;filter:none;border-color:var(--success);background:var(--success-container)}
.achiev-icon{font-size:2.2rem;margin-bottom:10px;line-height:1}
.achiev-name{font-family:var(--font-display);font-weight:500;font-size:.92rem;margin-bottom:6px;color:var(--on-surface);line-height:1.3}
.achiev-desc{font-size:.72rem;color:var(--on-surface-variant);line-height:1.35;margin-bottom:10px}
.achiev-prog-wrap{width:100%;height:2px;background:var(--rule);overflow:hidden}
.achiev-prog-fill{height:100%;background:var(--primary);transition:width .3s}
.achiev-card.unlocked .achiev-prog-fill{background:var(--success)}
.achiev-prog-text{font-size:.62rem;font-weight:700;color:var(--ink-subtle);margin-top:6px;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hm-nav-btn{background:transparent;border:none;cursor:pointer;font-size:1rem;color:var(--on-surface-variant);padding:8px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;transition:background .12s}
.hm-nav-btn:hover:not(:disabled){background:var(--surface-container);color:var(--on-surface)}
.hm-cell{width:12px;height:12px;border-radius:2px;flex-shrink:0;outline:1px solid rgba(28,25,23,.04);outline-offset:-1px}
.hm-scroll-container{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.hm-scroll-container::-webkit-scrollbar{display:none}
.hm-0{background:var(--surface-container-high)}
.hm-1{background:#C7C0A8}
.hm-2{background:#8C8468}
.hm-3{background:#5E563A}
.hm-4{background:#7C2D12}
:root[data-theme="dark"] .hm-0{background:#1F1B15}
:root[data-theme="dark"] .hm-1{background:#4A3F2C}
:root[data-theme="dark"] .hm-2{background:#7A6540}
:root[data-theme="dark"] .hm-3{background:#B08455}
:root[data-theme="dark"] .hm-4{background:#C2410C}
.sched-groups{display:flex;flex-direction:column;gap:18px}
.sched-disc{display:flex;flex-direction:column;gap:8px}
.sched-disc-name{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-subtle);padding:2px 0}
.sched-theme-group{background:transparent;border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.sched-theme-row{width:100%;background:transparent;border:none;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;font-family:var(--font-body);font-size:.88rem;text-align:left;color:var(--on-surface);transition:background .12s}
.sched-theme-row:hover{background:var(--surface-container)}
.sched-theme-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-family:var(--font-display);font-size:1rem}
.sched-theme-count{background:transparent;color:var(--on-surface-variant);font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:2px;border:1px solid var(--rule);flex-shrink:0;letter-spacing:.06em;text-transform:uppercase}
.sched-details{padding:10px 16px 14px;display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--rule)}
.sched-details .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;font-size:.82rem;color:var(--on-surface-variant)}
.sched-details .row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--on-surface);font-family:var(--font-display);font-size:.9rem}
.sched-details .row .val{font-weight:600;padding:2px 8px;border-radius:2px;font-size:.7rem;flex-shrink:0;white-space:nowrap;border:1px solid var(--rule);letter-spacing:.06em;text-transform:uppercase}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--rule);background:transparent;border-radius:0;margin-bottom:0;flex-wrap:wrap}
.settings-row:last-child{border-bottom:none}
.settings-row .settings-title{font-family:var(--font-display);font-weight:500;color:var(--on-surface);font-size:1rem;margin:0 0 4px;letter-spacing:-0.01em}
.settings-row .settings-desc{font-size:.82rem;color:var(--on-surface-variant);margin:0;line-height:1.55}
.settings-input{width:80px;padding:9px 12px;border:1px solid var(--rule);border-radius:var(--radius);font-family:var(--font-body);font-size:.9rem;background:var(--surface);color:var(--on-surface);text-align:center;font-variant-numeric:tabular-nums}
.settings-select{padding:9px 14px;border:1px solid var(--rule);border-radius:var(--radius);font-family:var(--font-body);font-size:.88rem;background:var(--surface);color:var(--on-surface);min-width:160px;max-width:100%}
.settings-card{background:transparent;border:none;border-bottom:1px solid var(--rule);border-radius:0;padding:18px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:0}
.settings-card:last-child{border-bottom:none}
.settings-card .info{flex:1 1 240px;min-width:0}
.settings-card .info h4{margin:0 0 4px;font-family:var(--font-display);font-size:1.05rem;font-weight:500;color:var(--on-surface);letter-spacing:-0.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.settings-card .info p{margin:0;font-size:.83rem;color:var(--on-surface-variant);line-height:1.55}
.settings-card .actions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;align-items:center}
.danger-box{background:transparent;border:1px solid var(--rule);border-left:3px solid var(--error);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px}
.danger-box-title{font-family:var(--font-display);font-weight:600;font-size:1.02rem;color:var(--error);margin-bottom:6px}
.danger-box-desc{font-size:.83rem;color:var(--on-surface-variant);line-height:1.55;margin:0 0 14px}
.step-card{background:transparent;border:1px solid var(--rule);border-radius:var(--radius);padding:18px;position:relative;display:flex;flex-direction:column;gap:6px}
.step-num{position:absolute;top:-11px;left:16px;width:24px;height:24px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;font-variant-numeric:tabular-nums}
.step-title{font-family:var(--font-display);font-weight:500;font-size:.98rem;color:var(--on-surface);margin-top:8px}
.step-desc{font-size:.82rem;color:var(--on-surface-variant);line-height:1.5}
.csv-table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--radius);background:var(--paper-raised);-webkit-overflow-scrolling:touch}
.csv-table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:720px}
.csv-table th{background:var(--surface-container);color:var(--ink-subtle);font-weight:700;padding:10px 12px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap;font-size:.65rem;text-transform:uppercase;letter-spacing:.1em}
.csv-table td{padding:10px 12px;border-bottom:1px solid var(--rule);color:var(--on-surface);vertical-align:top}
.csv-table tr:last-child td{border-bottom:none}
.csv-table tbody tr:hover{background:var(--surface-container)}
.csv-help{background:transparent;border:1px solid var(--rule);border-radius:var(--radius);padding:16px 20px;margin:14px 0 0;font-size:.82rem;line-height:1.6}
.csv-help summary{cursor:pointer;font-weight:600;color:var(--on-surface);padding:4px 0;outline:none;user-select:none;font-size:.86rem}
.csv-help summary:hover{color:var(--primary)}
.csv-help code{background:var(--surface-container);padding:2px 6px;border-radius:2px;font-size:.76rem;color:var(--on-surface);font-family:ui-monospace,SFMono-Regular,monospace;display:inline-block;margin:1px 0}
.csv-help .grid-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:14px}
.csv-help .col h5{margin:0 0 8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--ink-subtle)}
.csv-help .col p{margin:0;font-size:.8rem;line-height:1.9}

/* ============ SETTINGS — HIERARQUIA VISUAL ============ */

.import-modal-bg{position:fixed;inset:0;background:rgba(28,25,23,.55);z-index:9999999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}

.mapa-fechar{background:transparent;border:none;width:28px;height:28px;border-radius:50%;font-size:1rem;cursor:pointer;color:var(--on-surface-variant);display:flex;align-items:center;justify-content:center;transition:all .12s}

.mapa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px}
.mapa-item{aspect-ratio:1;border-radius:var(--radius-sm);border:1px solid var(--rule);background:transparent;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:var(--on-surface-variant);cursor:pointer;transition:all .15s;font-variant-numeric:tabular-nums;position:relative}
.mapa-item:hover{background:var(--surface-container);color:var(--on-surface);border-color:var(--rule-strong)}

#mq-lb{position:fixed;inset:0;background:rgba(28,25,23,.94);z-index:9999999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}

#mq-lb img{width:95vw;height:95vh;border-radius:var(--radius);object-fit:contain}

.progress-bar-wrap{display:none;position:fixed;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:0;z-index:99999;align-items:center;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.study-progress-line{width:100%;height:1px;background:var(--rule)}

.study-top-center{flex:1;display:flex;align-items:center;justify-content:center}

.fbtn-icon{background:transparent;border:none;color:var(--on-surface-variant);font-size:1rem;width:32px;height:32px;cursor:pointer;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;transition:all .12s;line-height:1}

.study-timer-control{height:32px;display:flex;align-items:center;gap:2px;padding:0 3px 0 10px;border:1px solid var(--rule);border-radius:9px;background:var(--surface-container);color:var(--on-surface-variant)}

.timer-toggle{width:26px;height:26px;min-width:26px;min-height:26px;border:0;background:transparent;color:inherit;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:none;transform:none}
.timer-toggle:hover,.timer-toggle:active,.timer-toggle:focus-visible{background:transparent;color:inherit;transform:none;box-shadow:none}

.session-delete-btn{width:28px;height:28px;min-width:28px;max-width:28px;min-height:28px;max-height:28px;aspect-ratio:1/1;box-sizing:border-box;flex:0 0 28px;padding:0!important;border:0;background:transparent;color:var(--ink-subtle);border-radius:50%!important;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;overflow:hidden;transition:background .12s,color .12s}
.session-delete-btn:hover{background:var(--error-container);color:var(--error)}
.session-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.session-summary-stat{border:1px solid var(--rule);border-radius:var(--radius);padding:14px 10px;text-align:center;background:var(--surface-container)}
.session-summary-stat strong{display:block;font-size:1.2rem;color:var(--on-surface);font-variant-numeric:tabular-nums}
.session-summary-stat span{display:block;margin-top:4px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-subtle);font-weight:700}
@media(max-width:600px){.session-summary-grid{grid-template-columns:repeat(2,1fr)}.study-timer{font-size:.72rem;min-width:44px}.study-timer-control{height:30px;padding-left:8px}.timer-toggle{width:24px;height:24px}.study-top-stats{gap:7px}}
#study-controls{display:flex;justify-content:center;align-items:center;gap:12px;margin:32px auto 44px;padding:0;max-width:920px;z-index:10}
.nav-btn{background:transparent;border:1px solid var(--rule);color:var(--on-surface-variant);padding:11px 22px;border-radius:var(--radius);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;font-family:var(--font-body)}
.nav-btn:hover:not(:disabled){border-color:var(--rule-strong);color:var(--on-surface);background:var(--surface-container)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}

.action-sheet{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:22px 24px;box-shadow:0 20px 50px rgba(28,25,23,.12);z-index:99998;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 40px);opacity:0;transition:opacity .2s}
.action-sheet.ativo{opacity:1}
.action-sheet .sheet-title{font-family:var(--font-display);font-weight:500;font-size:1.15rem;color:var(--on-surface);flex:1 1 100%;text-align:center;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-0.015em}
.action-sheet .sheet-btn{background:transparent;border:1px solid var(--rule);color:var(--on-surface);padding:9px 16px;border-radius:var(--radius);font-size:.82rem;font-weight:600;cursor:pointer;font-family:var(--font-body);white-space:nowrap;transition:all .12s}
.action-sheet .sheet-btn:hover:not(:disabled){background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.action-sheet .sheet-btn:disabled{opacity:.4;cursor:not-allowed}
.action-sheet .sheet-close{background:transparent;border:none;color:var(--on-surface-variant);font-size:1.2rem;cursor:pointer;padding:6px 10px;line-height:1;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.action-sheet .sheet-close:hover{background:var(--error-container);color:var(--error)}

#db-loading-overlay{position:fixed;inset:0;background:var(--surface);z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
#db-loading-overlay .spin{width:36px;height:36px;border:2px solid var(--rule);border-top-color:var(--primary);border-radius:50%;animation:dbspin .9s linear infinite}
#db-loading-overlay .txt{color:var(--on-surface-variant);font-size:.85rem;font-weight:500;font-family:var(--font-display);font-style:italic}
@keyframes dbspin{to{transform:rotate(360deg)}}

#font-toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--on-surface);color:var(--surface);padding:8px 18px;border-radius:var(--radius);font-size:.82rem;font-weight:600;z-index:9999999;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s}

/* ============ COHESION PASS 2026-10 ============ */
:root{
  --content-w:960px;
  --study-w:1160px;
  --control-h:40px;
  --control-h-touch:44px;
  --radius-sm:4px;
  --radius:6px;
  --radius-lg:10px;
  --shadow-float:0 18px 50px rgba(28,25,23,.10);
  --transition-fast:140ms ease;
}
:root[data-theme="dark"]{--shadow-float:0 20px 56px rgba(0,0,0,.36)}
html{scrollbar-gutter:stable;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{font-size:16px}
button,input,select,textarea{font:inherit}
button{min-height:var(--control-h)}
button:disabled{cursor:not-allowed}
::selection{background:var(--primary-container);color:var(--on-primary-container)}

/* Shared content rhythm */
.home-inner{max-width:var(--content-w);padding-top:24px}
.home-section{padding:30px 0}
.home-section + .home-section{border-top-color:var(--rule)}
.home-section[data-flat="1"]{padding-top:4px}
.section-head,.section-head-row{align-items:flex-start;gap:18px;margin-bottom:22px}
.section-head .label,.section-head-row .label,.smallcaps{line-height:1.35}
.section-head .title,.section-head-row .title{line-height:1.25}
.section-head .action,.section-head-row .cta{align-self:center}
.card{padding:20px;border-radius:var(--radius);margin-bottom:10px}
.empty-state{padding:36px 20px;line-height:1.6}
.kpi-line{gap:10px 24px;padding:12px 0 16px}
.kpi-line .kpi{gap:7px}

/* Navigation */
#sidebar .sidebar-inner{background:var(--paper-sunken)}
.sidebar-brand{min-height:76px;padding:24px 20px 20px}
.sidebar-nav{padding:14px 10px}
.nav-item{min-height:40px;padding:9px 12px;border-radius:var(--radius);gap:10px}
.nav-subitem{padding-left:34px}
.sidebar-footer{padding:10px 14px}
#plataforma-topbar{height:calc(56px + env(safe-area-inset-top,0px));padding-left:20px;padding-right:20px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
@media(min-width:901px){#plataforma-topbar{padding-left:calc(var(--sidebar-w) + 20px)}}
#home{padding-top:calc(56px + env(safe-area-inset-top,0px))}
.topbar-left{gap:12px}.topbar-right{gap:6px}.topbar-actions{gap:4px}
.btn-topbar{min-height:36px;padding:7px 10px;border-radius:var(--radius)}

/* Hero */
.hero{padding:30px 0 26px;margin-bottom:30px}
.hero-date{margin-bottom:8px}
.hero-title{font-size:clamp(1.75rem,3vw,2.2rem);margin-bottom:10px}
.hero-motivation{max-width:680px}
.hero-title .streak-inline{vertical-align:.18em;transform:none;margin-left:10px}

/* Buttons and controls */
.btn-primary,.btn-secondary,.btn-danger,.btn-responder,.back-btn,.btn-resolucao,.sheet-btn{
  min-height:var(--control-h);border-radius:var(--radius);transition:background var(--transition-fast),border-color var(--transition-fast),color var(--transition-fast),opacity var(--transition-fast),transform var(--transition-fast)
}
.btn-primary,.btn-secondary,.btn-danger{padding:9px 16px}
.btn-primary:active:not(:disabled),.btn-secondary:active:not(:disabled),.btn-danger:active:not(:disabled),.btn-topbar:active:not(:disabled){transform:translateY(1px)}
.btn-icon-sm{width:34px;height:34px;min-height:34px}
.back-btn{margin-bottom:20px;padding:8px 12px}
.settings-input,.settings-select,.import-modal input[type=text],.import-modal textarea,.import-modal select{min-height:var(--control-h);border-radius:var(--radius);background:var(--paper-raised)}
.settings-input:focus,.settings-select:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}

/* Lists, tiles and settings */
.discipline-grid{gap:10px}
.disc-tile{min-height:104px;padding:18px;gap:12px;border-radius:var(--radius)}
.theme-row{min-height:58px;padding:14px 8px;gap:12px}
.rank-row{min-height:58px;padding:14px 8px}
.settings-row{min-height:72px;padding:18px 0}
.settings-card{min-height:86px;padding:20px 0;align-items:center}
.settings-card .info p,.settings-row .settings-desc{max-width:640px}
.settings-card .actions{justify-content:flex-end}
.danger-box{padding:18px;border-radius:var(--radius)}
.step-card{min-height:138px;padding:20px 18px 18px}
.csv-table-wrap{border-radius:var(--radius)}
.csv-help{border-radius:var(--radius);padding:16px 18px}

/* Study */
main.questions-container{max-width:var(--study-w);margin:28px auto;padding:0 24px}
body.study-mode main.questions-container{max-width:var(--study-w);padding-top:72px}
.question{max-width:var(--study-w);padding:32px 34px;border-radius:var(--radius-lg)}
.q-header{margin-bottom:18px}.q-heading{gap:7px}
.statement{max-width:82ch;margin-bottom:26px;line-height:1.72;text-wrap:pretty}
.alternatives{gap:7px;padding-top:20px}
.alternative{min-height:52px;padding:13px 14px;gap:12px;border-radius:var(--radius);align-items:flex-start}
.letter{margin-top:2px}
.action-area{margin-top:26px;padding-top:20px}
.resolucao-pane{padding:22px;border-radius:var(--radius);line-height:1.7}
.progress-bar-wrap{background:color-mix(in srgb,var(--surface) 95%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.study-header-inner{max-width:var(--study-w);height:52px}
#study-controls{max-width:var(--study-w);margin-top:26px}
.nav-btn{min-height:42px}

/* Floating surfaces */
.import-modal-bg{padding:18px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.import-modal{padding:28px;border-radius:var(--radius-lg);box-shadow:var(--shadow-float)}
.import-modal h3{line-height:1.25}
.import-modal .row{gap:8px;margin-top:22px}
.mapa-panel{border-radius:var(--radius-lg);box-shadow:var(--shadow-float)}
.action-sheet{box-shadow:var(--shadow-float)}

/* Consistent hover only on devices that actually hover */
@media(hover:none){
  .card:hover,.disc-tile:hover,.theme-row:hover,.rank-row:hover{border-color:var(--rule)}
}

/* Tablet / mobile */
@media(max-width:900px){
  body{padding-top:calc(56px + env(safe-area-inset-top,0px))}
  .home-inner{padding:18px 18px calc(96px + env(safe-area-inset-bottom,0px))}
  .hero{padding:22px 0 20px;margin-bottom:24px}
  .home-section{padding:26px 0}
  .question{padding:24px 20px}
  body.study-mode main.questions-container{padding:66px 16px 32px}
  #plataforma-topbar{padding-left:12px;padding-right:12px}
  .topbar-breadcrumb{font-size:.8rem}
  .topbar-actions .btn-topbar{padding-left:8px;padding-right:8px}
}
@media(max-width:600px){
  :root{--control-h:44px}
  .home-inner{padding-left:16px;padding-right:16px}
  .hero-title{font-size:1.7rem;line-height:1.18}
  .hero-title .streak-inline{display:table;margin:10px 0 0;vertical-align:initial}
  .section-head,.section-head-row{gap:12px;margin-bottom:18px}
  .section-head .action,.section-head-row .cta{width:100%;align-self:auto}
  .section-head .action > button,.section-head-row .cta > button{width:100%}
  .kpi-line{gap:8px 18px}
  .discipline-grid{gap:8px}
  .disc-tile{min-height:96px}
  .settings-card{align-items:flex-start;padding:18px 0}
  .settings-card .actions{width:100%;justify-content:stretch}
  .settings-card .actions > button{flex:1 1 140px}
  .settings-row{align-items:flex-start}
  .settings-input,.settings-select{max-width:100%}
  .question{padding:20px 16px;border-left:0;border-right:0;border-radius:0}

var syncInFlight = null;
function syncPush(){ return syncPull(false); }
function syncPull(manual){
  var url = getSyncUrl();
  if(!url){if(manual) alert('Configure a URL em Configurações → Sincronização.');return Promise.resolve({ok:false,reason:'no-url'});}
  if(syncInFlight) return syncInFlight;
  syncStamp(); __syncState='syncing'; updateSyncStatusUI();
  function jsonResponse(res){if(!res.ok) throw new Error('HTTP '+res.status);return res.text().then(function(t){
    var value;try{value=JSON.parse(t);}catch(e){throw new Error('Servidor não retornou JSON válido');}
    if(!value || typeof value!=='object' || Array.isArray(value)) throw new Error('Resposta de sincronização inválida');
    if(value.ok===false || value.error) throw new Error(value.error || 'Servidor recusou sincronização');return value;
  });}
  syncInFlight = fetch(url+(url.indexOf('?')<0?'?':'&')+'t='+Date.now(),{method:'GET',mode:'cors',redirect:'follow',cache:'no-store'})
    .then(jsonResponse).then(function(remote){
      if(remote.progress && typeof remote.progress==='object') remote=remote.progress;
      else if(remote.data && typeof remote.data==='object') remote=remote.data;
      else if(Object.keys(remote).length && Object.keys(remote).every(function(k){return ['ok','message'].indexOf(k)>=0;})) throw new Error('Servidor não retornou o estado salvo');
      var changed = mergeProgress(remote); applySettingsFromProgress();
      localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));
      if(changed && state.view==='home') renderHome();
      // DATA (the question bank) is deliberately absent from this payload.
      var snapshot = JSON.stringify(progress);
      return fetch(url,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain'},body:snapshot,redirect:'follow'})
        .then(jsonResponse).then(function(){
          return fetch(url+(url.indexOf('?')<0?'?':'&')+'t='+Date.now(),{method:'GET',mode:'cors',redirect:'follow',cache:'no-store'}).then(jsonResponse);
        }).then(function(saved){
          saved=saved.progress || saved.data || saved;
          var expected=syncEntries(JSON.parse(snapshot)), actual=syncEntries(saved);
          if(Object.keys(expected).some(function(k){return JSON.stringify(expected[k])!==JSON.stringify(actual[k]);}))
            throw new Error('Servidor não confirmou todos os dados enviados');
          var revisions=JSON.parse(snapshot)._sync.revisions || {};
          if(JSON.stringify(saved._sync && saved._sync.revisions || {})!==JSON.stringify(revisions))
            throw new Error('Servidor não preservou os metadados de sincronização');
          __syncState='ok';__syncMsg='';setLastSyncTime(Date.now());updateSyncStatusUI();
          if(manual) alert('✅ Dados enviados e confirmados na nuvem.');return {ok:true};
        });
    }).catch(function(e){__syncState='error';__syncMsg=e.message;updateSyncStatusUI();if(manual) alert('❌ '+e.message);return {ok:false,error:e.message};})
    .finally(function(){syncInFlight=null;});
  return syncInFlight;
}
function syncTest(){
  var url = getSyncUrl(); if(!url) return Promise.resolve({ ok:false, msg:'Nenhuma URL configurada' });
  return fetch(url + (url.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now(), { method:'GET', mode:'cors', redirect:'follow' })
    .then(function(res){ if(!res.ok) return { ok:false, msg:'HTTP ' + res.status }; return res.text().then(function(txt){ try { var d = txt ? JSON.parse(txt) : {}; return { ok:true, empty: !d || Object.keys(d).length === 0 }; } catch(e){ return { ok:false, msg:'Servidor não retornou JSON válido' }; } }); })
    .catch(function(e){ return { ok:false, msg: (e && e.message) || 'Erro de rede/CORS' }; });

function srIsOverdue(qid){var st=progress[qid];if(!st||!st.answered||st.box===-1||!st.nextReview)return false;return st.nextReview<startOfToday();}
function srIsToday(qid){var st=progress[qid];if(!st||!st.answered||st.box===-1||!st.nextReview)return false;var t=startOfToday();return st.nextReview>=t&&st.nextReview<=endOfToday();}
function srIsDue(qid){return srIsOverdue(qid)||srIsToday(qid);}
function srStatus(qid){var st=progress[qid];if(!st)return 'new';if(st.answered&&st.correct&&!st.confidence)return 'pending';if(st.box===-1)return 'mastered';if(srIsOverdue(qid))return 'overdue';if(srIsToday(qid))return 'due';if(st.nextReview)return 'scheduled';return st.answered?'answered':'new';}
function srBadgeText(qid){var st=progress[qid];if(!st)return '';var s=srStatus(qid);if(s==='pending')return 'Confirmar';if(s==='mastered')return 'Dominada';if(s==='overdue'){var d=Math.ceil((Date.now()-st.nextReview)/DAY_MS);return 'Atrasada'+(d>1?' '+d+'d':'');}if(s==='due')return 'Hoje';if(s==='scheduled'){var dd=Math.ceil((st.nextReview-Date.now())/DAY_MS);if(dd<=1)return 'Amanhã';return dd+'d';}if(s==='answered')return st.correct?'Correta':'Errada';return '';}
function srBadgeClass(qid){var s=srStatus(qid);if(s==='pending')return 'pending';if(s==='mastered')return 'mastered';if(s==='overdue')return 'overdue';if(s==='due')return 'due';if(s==='scheduled')return 'scheduled';return 'novo';}

function recomputeStreakFromActivity(){
  var act = progress.activity || {};
  var today = new Date(); today.setHours(12,0,0,0);
  var todayStr = getYYYYMMDD(today.getTime());
  var current = 0; var cursor = new Date(today.getTime());
  if(!act[todayStr] || act[todayStr] <= 0) cursor.setDate(cursor.getDate() - 1);
  while(true){ var ds = getYYYYMMDD(cursor.getTime()); if(act[ds] && act[ds] > 0){ current++; cursor.setDate(cursor.getDate() - 1); } else break; }
  var actDates = Object.keys(act).filter(function(d){ return act[d] > 0; }); actDates.sort();
  var max = 0, run = 0, prevTime = null;
  actDates.forEach(function(ds){ var parts = ds.split('-'); if(parts.length !== 3) return; var t = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10), 12, 0, 0, 0).getTime(); if(prevTime === null){ run = 1; } else { run = (Math.round((t - prevTime) / DAY_MS) === 1) ? run + 1 : 1; } if(run > max) max = run; prevTime = t; });
  progress.streak = progress.streak || { current: 0, max: 0, lastDate: null };
  progress.streak.current = current;
  if(max > progress.streak.max) progress.streak.max = max;
  if(actDates.length > 0) progress.streak.lastDate = actDates[actDates.length - 1];
}
function updateActivity(){
  var today = getYYYYMMDD();
  progress.activity = progress.activity || {};
  progress.activity[today] = (progress.activity[today] || 0) + 1;
  recomputeStreakFromActivity();
  invalidateAnalyzeCache();
  saveProgress();
}
function getDynamicAchievements(s){
  var t = Math.max(1, s.total || 1);

  /*
   * Curva progressiva: os primeiros marcos ficam próximos e os intervalos
   * aumentam gradualmente. Assim há recompensa frequente no começo sem
   * transformar os níveis finais em etapas triviais.
   */
  function progressiveTiers(total, desiredSteps){
    total = Math.max(1, Math.floor(total || 1));
    var steps = Math.min(desiredSteps, total);
    if(steps <= 1) return [total];
    var out = [];
    for(var i=0;i<steps;i++){
      var p = i / (steps - 1);
      var value = (i === 0) ? 1 : Math.round(1 + (total - 1) * Math.pow(p, 2));
      if(out.length && value <= out[out.length - 1]) value = out[out.length - 1] + 1;
      if(value > total) value = total;
      out.push(value);
    }
    out[out.length - 1] = total;
    return out;
  }

  var tiersQ = progressiveTiers(t, 10);
  var tiersM = progressiveTiers(t, 10);
  var list = [];

  var qNames = ['Primeiro Passo','Aquecimento','Ganhando Ritmo','Estudioso','Persistente','Veterano','Máquina','Inabalável','Lendário','Mito das Questões'];
  var qIcons = ['🥉','🥈','📚','🥇','⚙️','🏆','🔧','🛡️','🐉','👑'];
  tiersQ.forEach(function(max, i){
    var finalTier = i === tiersQ.length - 1;
    list.push({
      cat:'q', id:'q_'+(i+1), name:qNames[i],
      desc: finalTier ? 'Responda todas as '+max+' questões' : 'Responda '+max+' '+(max===1?'questão':'questões'),
      max:max, getVal:function(x){return x.answered;}, icon:qIcons[i]
    });
  });

  var mNames = ['Aprendiz','Iniciado','Competente','Especialista','Mestre','Grão-Mestre','Supremo','Ascendente','Iluminado','Deus do Domínio'];
  var mIcons = ['📖','🪶','🛠️','🧠','🧙','🔮','⚡','🌠','✨','🌌'];
  tiersM.forEach(function(max, i){
    var finalTier = i === tiersM.length - 1;
    list.push({
      cat:'m', id:'m_'+(i+1), name:mNames[i],
      desc: finalTier ? 'Domine todas as '+max+' questões' : 'Domine '+max+' '+(max===1?'questão':'questões'),
      max:max, getVal:function(x){return x.mastered;}, icon:mIcons[i]
    });
  });

  var streakMax = function(){ return progress.streak ? progress.streak.max : 0; };
  var streakTiers = [2,4,7,10,14,20,30,45,60,80,100];
  var streakNames = ['Faísca','Chama Inicial','Semana Perfeita','Ritmo Firme','Foco Quinzenal','Constância','Mês Invicto','Disciplina','Incansável','Elite','Centurião'];
  var streakIcons = ['🔥','🕯️','☄️','🎯','🧭','⏳','🚀','🛡️','⚡','💎','🪖'];
  streakTiers.forEach(function(max, i){
    list.push({cat:'s',id:'s_'+max,name:streakNames[i],desc:'Ofensiva de '+max+' dias',max:max,getVal:streakMax,icon:streakIcons[i]});
  });
  return list;
}

function autoEmbedImageUrls(html){
  if(!html) return html;
  var s = String(html);
  if(s.toLowerCase().indexOf('http') === -1 && s.indexOf('data:image') === -1) return s;
  var protectedImgs = []; s = s.replace(/<img\b[^>]*>/gi, function(m){ protectedImgs.push(m); return '\u0000IMG'+(protectedImgs.length-1)+'\u0000'; });
  var protectedTags = []; s = s.replace(/<[^>]+>/g, function(m){ protectedTags.push(m); return '\u0000TAG'+(protectedTags.length-1)+'\u0000'; });
  s = s.replace(/(^|[\s\n])(https?:\/\/[^\s<>"'\u0000]+\.(?:png|jpe?g|gif|webp|svg|bmp|avif)(?:[?#][^\s<>"'\u0000]*)?)(?=[\s\n\u0000]|$)/gi, function(_, pre, url){ return pre + '<img src="'+url+'" alt="" loading="lazy">'; });
  s = s.replace(/(^|[\s\n])(data:image\/[^\s<>"'\u0000]+)(?=[\s\n\u0000]|$)/gi, function(_, pre, url){ return pre + '<img src="'+url+'" alt="" loading="lazy">'; });
  s = s.replace(/\u0000TAG(\d+)\u0000/g, function(_, i){ return protectedTags[parseInt(i,10)]; });
  s = s.replace(/\u0000IMG(\d+)\u0000/g, function(_, i){ return protectedImgs[parseInt(i,10)]; });
  return s;
}

function observe(){
  var qs = document.querySelectorAll('.question');
  if(!('IntersectionObserver' in window)){ for(var i=0;i<qs.length;i++) processQuestion(qs[i]); return; }
  var obs = new IntersectionObserver(function(entries){ for(var e=0;e<entries.length;e++){ if(entries[e].isIntersecting){ processQuestion(entries[e].target); obs.unobserve(entries[e].target); } } }, {rootMargin:'800px 0px'});
  for(var j=0;j<qs.length;j++) obs.observe(qs[j]);
}

function analyzeAll(){
  if(_analyzeCache) return _analyzeCache;
  var s = {total:0,answered:0,correct:0,wrong:0,mastered:0,overdue:0,today:0,due:0,unanswered:0,flagged:0,totalMs:0,byDisc:{},byTheme:{},list:[]};
  var all = document.querySelectorAll('.question');
  for(var i=0;i<all.length;i++){
    var a = all[i];
    var qid = a.getAttribute('data-qid');
    var mat = a.getAttribute('data-mat') || 'Sem disciplina';
    var tema = a.getAttribute('data-tema') || 'Sem tema';
    var temaKey = mat + ':::' + tema;
    var st = progress[qid];
    s.total++;
    s.list.push({qid:qid, mat:mat, tema:tema, st:st});
    if(!s.byDisc[mat]) s.byDisc[mat] = {total:0,answered:0,correct:0,wrong:0,mastered:0,overdue:0,today:0,due:0,unanswered:0,flagged:0,totalMs:0};
    if(!s.byTheme[temaKey]) s.byTheme[temaKey] = {name:tema,mat:mat,total:0,answered:0,correct:0,wrong:0,mastered:0,overdue:0,today:0,due:0,unanswered:0,flagged:0,totalMs:0};
    s.byDisc[mat].total++; s.byTheme[temaKey].total++;
    if(st && st.flagged){ s.flagged++; s.byDisc[mat].flagged++; s.byTheme[temaKey].flagged++; }
    if(st && st.totalMs){ s.totalMs += st.totalMs; s.byDisc[mat].totalMs += st.totalMs; s.byTheme[temaKey].totalMs += st.totalMs; }
    if(st && st.answered){
      s.answered++; s.byDisc[mat].answered++; s.byTheme[temaKey].answered++;
      if(st.correct){ s.correct++; s.byDisc[mat].correct++; s.byTheme[temaKey].correct++; }
      else { s.wrong++; s.byDisc[mat].wrong++; s.byTheme[temaKey].wrong++; }
      if(st.box === -1){ s.mastered++; s.byDisc[mat].mastered++; s.byTheme[temaKey].mastered++; }
      if(srIsOverdue(qid)){ s.overdue++; s.byDisc[mat].overdue++; s.byTheme[temaKey].overdue++; }
      if(srIsToday(qid)){ s.today++; s.byDisc[mat].today++; s.byTheme[temaKey].today++; }
      if(srIsDue(qid)){ s.due++; s.byDisc[mat].due++; s.byTheme[temaKey].due++; }
    } else { s.unanswered++; s.byDisc[mat].unanswered++; s.byTheme[temaKey].unanswered++; }
  }
  _analyzeCache = s;
  return s;
}

function buildReviewForecast(days){
  var today0 = startOfToday();
  var buckets = [];
  for(var i=0;i<days;i++){ var start = today0 + i*DAY_MS; buckets.push({start:start, end:start+DAY_MS, count:0}); }
  var all = document.querySelectorAll('.question');
  var overdueTotal = 0;
  for(var q=0;q<all.length;q++){
    var qid = all[q].getAttribute('data-qid');
    var st = progress[qid];
    if(!st || !st.answered || st.box === -1 || !st.nextReview) continue;
    if(st.nextReview < today0){ overdueTotal++; continue; }
    var dayStart = startOfDay(st.nextReview);
    var idx = Math.round((dayStart - today0) / DAY_MS);
    if(idx >= 0 && idx < days) buckets[idx].count++;
  }
  var dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  var mes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  for(var j=0;j<days;j++){
    var d = new Date(buckets[j].start);
    var dd = d.getDate(), mm = mes[d.getMonth()], wd = dias[d.getDay()];
    if(j === 0){ buckets[j].label = 'Hoje'; buckets[j].shortLabel = 'Hoje'; }
    else { buckets[j].label = wd+' '+dd+'/'+mm; buckets[j].shortLabel = dd+'/'+mm; }
  }
  return {overdue:overdueTotal, days:buckets};
}
function renderForecastChart(forecast, maxCount){
  var html = '<div class="review-chart">';
  if(forecast.overdue > 0){
    html += '<div class="bar"><div class="bar-count">'+forecast.overdue+'</div><div class="bar-fill overdue" style="height:'+(forecast.overdue/maxCount*100)+'%"></div><div class="bar-label" style="color:var(--overdue);font-weight:700"><span class="lbl-full">Atras.</span><span class="lbl-short">Atr.</span></div></div>';
  }
  forecast.days.forEach(function(b,i){
    var pct = b.count / maxCount * 100;
    var cls = i===0 ? 'today' : (b.count>0 ? 'future' : 'empty');
    html += '<div class="bar"><div class="bar-count">'+(b.count||'')+'</div><div class="bar-fill '+cls+'" style="height:'+pct+'%"></div><div class="bar-label"><span class="lbl-full">'+esc(b.label)+'</span><span class="lbl-short">'+esc(b.shortLabel || b.label)+'</span></div></div>';
  });
  html += '</div>';
  return html;
}

function buildEvolutionChart(){
  var weeks = 12;
  var buckets = [];
  var today = startOfToday();
  for(var i=weeks-1;i>=0;i--){
    var end = today - i*7*DAY_MS + DAY_MS - 1;
    var start = end - 7*DAY_MS + 1;
    buckets.push({start:start, end:end, correct:0, total:0, label:''});
  }
  Object.keys(progress).forEach(function(qid){
    var st = progress[qid];
    if(!st || !st.attempts) return;
    st.attempts.forEach(function(at){
      for(var b=0;b<buckets.length;b++){
        if(at.ts >= buckets[b].start && at.ts <= buckets[b].end){ buckets[b].total++; if(at.correct) buckets[b].correct++; break; }
      }
    });
  });
  var W = 720, H = 180, padL = 30, padR = 10, padT = 14, padB = 28;
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var rates = buckets.map(function(b){ return b.total > 0 ? (b.correct/b.total) : null; });
  var validRates = rates.filter(function(r){ return r !== null; });
  if(validRates.length === 0){ return '<div class="empty-state">Sem dados suficientes. Responda questões para ver a evolução.</div>'; }
  var minR = Math.min.apply(null, validRates), maxR = Math.max.apply(null, validRates);
  if(maxR - minR < 0.1){ minR = Math.max(0, minR - 0.05); maxR = Math.min(1, maxR + 0.05); }
  var yRange = maxR - minR;
  function xFor(i){ return padL + (i/(weeks-1))*innerW; }
  function yFor(r){ return padT + (1 - (r - minR)/yRange) * innerH; }
  var pathD = '';
  var circles = '';
  var points = [];
  for(var i=0;i<weeks;i++){
    if(rates[i] === null) continue;
    points.push({x:xFor(i), y:yFor(rates[i]), r:rates[i], total:buckets[i].total, label:''});
    var d1 = new Date(buckets[i].start); var d2 = new Date(buckets[i].end);
    var fmt = function(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); };
    var lbl = fmt(d1)+'–'+fmt(d2);
    points[points.length-1].label = lbl;
  }
  for(var p=0;p<points.length;p++){
    pathD += (p===0 ? 'M' : 'L') + points[p].x.toFixed(1) + ' ' + points[p].y.toFixed(1) + ' ';
    circles += '<circle cx="'+points[p].x.toFixed(1)+'" cy="'+points[p].y.toFixed(1)+'" r="3.5" fill="var(--primary)"><title>'+points[p].label+': '+points[p].total+' resp · '+Math.round(points[p].r*100)+'%</title></circle>';
  }
  var yTicks = '';
  for(var t=0;t<=4;t++){
    var rr = minR + (yRange)*(t/4);
    var yy = yFor(rr);
    yTicks += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'" stroke="var(--rule)" stroke-width="0.5" opacity="0.5"/>';
    yTicks += '<text x="'+(padL-4)+'" y="'+(yy+3).toFixed(1)+'" font-size="9" fill="var(--ink-subtle)" text-anchor="end">'+Math.round(rr*100)+'%</text>';
  }
  return '<svg class="evolution-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Evolução de acertos nas últimas 12 semanas">'+
    yTicks +
    '<path d="'+pathD.trim()+'" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    circles +
    '</svg>';
}

function buildHeatmap(){
  var today = new Date(); today.setHours(12,0,0,0);
  var offsetMs = (state.hmOffset || 0) * 52 * 7 * 86400000;
  var refDate = new Date(today.getTime() - offsetMs);

  gridHtml += '<span>Dom</span><span></span><span>Ter</span><span></span><span>Qui</span><span></span><span>Sáb</span></div>';
  var currentMonth = -1;
  for(var w=0;w<weeks;w++){
    var colHtml = '<div style="display:grid;grid-template-rows:repeat(7,12px);gap:4px;">';
    var firstDayOfWeek = new Date(startDate.getTime() + w*7*86400000);

      currentMonth = firstDayOfWeek.getMonth();
    } else { monthRow += '<div style="width:12px;"></div>'; }
    for(var r=0;r<7;r++){
      var dIndex = w*7 + r;

  }
  gridHtml += '</div>'; monthRow += '</div>';

  html += '</div>';
  html += '<div style="font-size:0.68rem;color:var(--ink-subtle);text-align:center;margin-top:10px;display:flex;justify-content:center;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;">Menos <div class="hm-cell hm-0"></div><div class="hm-cell hm-1"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div> Mais</div>';
  return html;

function renderHome(options){

  // Somente navegações explícitas devem solicitar resetScroll.
  var previousHomeScroll = homeEl ? homeEl.scrollTop : 0;
  var previousWindowScroll = window.scrollY || 0;
  var resetScroll = options.resetScroll === true;
  var content = '';
  if(state.homeTab === 'overview') content = renderTabOverview();
  else if(state.homeTab === 'stats') content = renderTabStats();
  else if(state.homeTab === 'disciplines') content = renderTabDisciplines();
  else if(state.homeTab === 'reviews') content = renderTabReviews();
  else if(state.homeTab === 'achievements') content = renderTabAchievements();

  else content = renderTabOverview();

  inner.innerHTML = heroHtml + content;

    homeEl.scrollTop = 0;

      if(state.view === 'home' && homeEl){
        homeEl.scrollTop = previousHomeScroll;

      }

  bindSettings();
  updateSyncStatusUI();

  html += '<div class="overview-stat"><div class="overview-stat-value er">' + s.wrong + '</div><span class="overview-stat-label">Erros</span></div>';

  html += '<div class="progress-bar-track"><div style="width:' + pctMeta + '%;background:' + (pctMeta >= 100 ? 'var(--success)' : 'var(--primary)') + '"></div></div>';
  html += '<div class="meta-bar-labels"><span>' + pctMeta + '% concluído</span>' + (pctMeta >= 100 ? '<span style="color:var(--success);font-weight:600;">Meta batida! 🎉</span>' : '<span>Faltam ' + (metaDia - actToday) + '</span>') + '</div>';
  html += '</div></div></section>';

  html += '</div></div>';

      html += '</div></div>';

    html += '<div class="overview-resume"><div class="overview-study-head"><span class="overview-study-title">Continuar de onde parou</span></div><p class="overview-action-desc">Nenhuma sessão em andamento. Inicie uma nova sessão acima.</p></div>';
  }
  html += '</div></section>';
  return html;
}

function renderTabStats(){
  var s = analyzeAll();
  var taxa = s.answered > 0 ? Math.round(s.correct / s.answered * 100) : 0;
  var pDom = s.total > 0 ? Math.round(s.mastered / s.total * 100) : 0;
  var temas = [];
  Object.keys(s.byTheme || {}).forEach(function(k){
    var t = s.byTheme[k]; if(!t) return;
    temas.push({key:k,name:t.name,mat:t.mat,total:t.total,answered:t.answered,correct:t.correct,wrong:t.wrong,mastered:t.mastered,overdue:t.overdue,today:t.today,unanswered:t.unanswered,rate:t.answered > 0 ? t.correct / t.answered : 0});
  });
  temas.sort(function(a,b){ return b.rate - a.rate; });
  var temasComBase = temas.filter(function(t){ return t.answered >= 3; });
  var metaAcertos = getMetaAcertos(); var limiteAlerta = getLimiteAlerta();
  var fortes = temasComBase.filter(function(t){ return t.rate >= metaAcertos; }).slice(0,5);
  var fracos = temasComBase.filter(function(t){ return t.rate < limiteAlerta; }).reverse().slice(0,5);

  html += '<div class="kpi"><span class="v ok">' + s.correct + '</span><span class="l">acertos</span></div>';
  html += '<div class="kpi"><span class="v er">' + s.wrong + '</span><span class="l">erros</span></div>';
  html += '<div class="kpi"><span class="v wr">' + s.today + '</span><span class="l">hoje</span></div>';
  html += '<div class="kpi"><span class="v over">' + s.overdue + '</span><span class="l">atrasadas</span></div>';
  html += '</div>';
  var pctAcertos = s.total > 0 ? (s.correct / s.total * 100) : 0;
  var pctErros = s.total > 0 ? (s.wrong / s.total * 100) : 0;
  html += '<div style="margin-top:22px;padding-top:16px;border-top:1px dashed var(--rule);">';
  html += '<div class="smallcaps" style="margin-bottom:10px;">Progresso do banco</div>';
  html += '<div class="progress-bar-track">';
  if(s.correct > 0) html += '<div style="width:' + pctAcertos + '%;background:var(--success);"></div>';
  if(s.wrong > 0) html += '<div style="width:' + pctErros + '%;background:var(--error);"></div>';
  html += '</div>';
  html += '<div class="meta-bar-labels"><span>' + s.correct + ' corretas</span><span>' + s.wrong + ' erradas</span><span>' + (s.total - s.answered) + ' restantes</span></div>';
  html += '</div>';
  html += '<div style="margin-top:22px;padding-top:16px;border-top:1px dashed var(--rule);">';

  html += '<span class="v">' + s.mastered + ' <span class="sub">de ' + s.total + ' (' + pDom + '%)</span></span></div>';
  html += '<div class="bar-track"><div style="width:' + pDom + '%;background:var(--success);"></div></div>';
  html += '</div></section>';

  if(s.answered > 0 && s.totalMs > 0){

    });
  }
  html += '</section>';

  html += '<section class="home-section">';
  html += '<div class="section-head"><div><div class="label">Detalhes</div><div class="title">Raio-X por disciplina</div></div></div>';

discKeys.forEach(function(k){
