        html += '<div class="stats-themes-wrap" style="display:none; border-top:1px solid var(--rule);">';
        html += '<div style="padding:14px 20px; background:var(--surface-container); display:flex; gap:10px; font-size:.75rem; font-weight:600; flex-wrap:wrap;">';
        html += '<span style="background:var(--surface); padding:4px 8px; border-radius:4px; border:1px solid var(--rule); color:var(--on-surface-variant);">' + d.total + ' questões</span>';

        html += '<span style="background:var(--surface); padding:4px 8px; border-radius:4px; border:1px solid var(--rule); color:var(--error);">' + d.wrong + ' erradas</span>';
        html += '<span style="background:var(--surface); padding:4px 8px; border-radius:4px; border:1px solid var(--rule); color:var(--primary);">' + d.mastered + ' dominadas</span>';
        if(d.overdue > 0) html += '<span style="background:var(--surface); padding:4px 8px; border-radius:4px; border:1px solid var(--rule); color:var(--overdue);">' + d.overdue + ' atrasadas</span>';
        if(d.today > 0) html += '<span style="background:var(--surface); padding:4px 8px; border-radius:4px; border:1px solid var(--rule); color:var(--warn);">' + d.today + ' hoje</span>';
        html += '</div>';

            html += '<div style="flex:1; min-width:0;">';

            html += '<div style="display:flex; flex-direction:column; gap:4px; margin-top:8px;">';

            html += '<span style="color:var(--rule); font-size:.8rem;">•</span>';
            html += '<span>Faltam: <strong>' + mt.unanswered + '</strong></span>';
            html += '</div>';

            if(mt.answered > 0 || mt.overdue > 0 || mt.today > 0) {
                html += '<div style="font-size:.72rem; display:flex; gap:8px; flex-wrap:wrap; font-variant-numeric:tabular-nums; align-items:center;">';
                
                var parts = [];

                    parts.push('<span style="color:var(--error);">Erros: <strong>' + mt.wrong + '</strong></span>');
                    if(mt.mastered > 0) parts.push('<span style="color:var(--primary);">Dominadas: <strong>' + mt.mastered + '</strong></span>');

          });
          html += '</div>';
        }
        
        html += '<div style="padding:12px 20px 16px; text-align:right;">';
        html += '<button class="btn-secondary" data-haction="open-disc" data-mat="' + escAttr(k) + '">Explorar disciplina →</button>';
        html += '</div>';
        html += '</div></div>';
      });
  }
  html += '</section>';
  return html;
}

  var keys = Object.keys(s.byDisc).sort(function(a,b){ return a.localeCompare(b, 'pt-BR'); });
  var html = '';
  if(keys.length === 0) return '<section class="home-section" data-flat="1"><div class="empty-state">Nenhuma disciplina. Vá em <strong>Configurações → Conteúdo</strong> para importar.</div></section>';
  html += '<section class="home-section" data-flat="1">';

  html += '<div class="discipline-grid">';
  keys.forEach(function(k){
    var d = s.byDisc[k];
    var rate = d.answered > 0 ? Math.round(d.correct / d.answered * 100) : 0;
    var prog = d.total > 0 ? Math.round(d.answered / d.total * 100) : 0;

/* Revisões: filtros combináveis, seleção exata e agenda somente para consulta. */
var reviewUI = {period:'all', discs:[], themes:[], day:null};
function reviewKey(q){ return q.mat + ':::' + q.tema; }
function reviewPool(){
  return analyzeAll().list.filter(function(q){ return q.st && q.st.answered && q.st.box !== -1 && q.st.nextReview; });
}
function reviewInScope(q){
  return (!reviewUI.discs.length || reviewUI.discs.indexOf(q.mat) !== -1) && (!reviewUI.themes.length || reviewUI.themes.indexOf(reviewKey(q)) !== -1);
}
function reviewInPeriod(q){ return reviewUI.period === 'today' ? srIsToday(q.qid) : (reviewUI.period === 'overdue' ? srIsOverdue(q.qid) : srIsDue(q.qid)); }
function reviewSelection(mat, theme){
  return reviewPool().filter(function(q){ return reviewInScope(q) && reviewInPeriod(q) && (mat == null || q.mat === mat) && (theme == null || reviewKey(q) === theme); }).sort(function(a,b){ return a.st.nextReview - b.st.nextReview || a.qid.localeCompare(b.qid); });
}
function reviewCounts(items){
  var today = 0, overdue = 0;
  items.forEach(function(q){ if(srIsToday(q.qid)) today++; else if(srIsOverdue(q.qid)) overdue++; });
  return {today:today,overdue:overdue,all:today+overdue};
}
function reviewDate(ts){ return new Date(ts).toLocaleDateString('pt-BR'); }
function reviewLateDays(ts){
  var a = new Date(startOfToday()), b = new Date(ts);
  return Math.max(0, Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()) - Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())) / DAY_MS));
}
function agendaItems(dayKey){
  return reviewPool().filter(function(q){return reviewInScope(q) && getYYYYMMDD(q.st.nextReview) === dayKey;}).sort(function(a,b){return a.st.nextReview-b.st.nextReview || a.qid.localeCompare(b.qid);});
}
function startAgendaReview(dayKey, qid){
  var items = agendaItems(dayKey).filter(function(q){return !qid || q.qid === qid;});
  if(!items.length) { refreshReviews(); return; }
  var advance = items[0].st.nextReview > endOfToday();
  var name = (advance ? 'Revisão antecipada' : 'Revisão') + ' · ' + reviewDate(items[0].st.nextReview);
  if(qid) name += ' · ' + items[0].tema;
  var sess = createSessionObj(name, [], [], 'all', true);
  sess.qids = items.map(function(q){return q.qid;});
  sess.isMixed = new Set(items.map(reviewKey)).size > 1;
  sess.agendaDay = dayKey;
  launchStudyFlow(sess);
}
function reviewPreviewText(payload){
  return String(payload.st || payload.n || '').replace(/<[^>]*>/g,' ')
    .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')
    .replace(/&quot;/gi,'"').replace(/&#39;/g,"'").replace(/\s+/g,' ').trim();
}
function reviewExcerpt(text, maxChars){
  text = String(text || '').replace(/\s+/g,' ').trim();
  if(!text) return '';
  function withEllipsis(value){
    value = String(value || '').replace(/[\s.,;:!?…]+$/,'').trim();
    return value ? value + '...' : '';
  }
  // Toda prévia termina com reticências para deixar claro que é apenas um trecho.
  if(text.length <= maxChars) return withEllipsis(text);
  var end = maxChars - 3;
  // Interrompe somente entre palavras e une as reticências ao trecho.
  if(!/\s/.test(text.charAt(end))){
    var boundary = text.lastIndexOf(' ',end);
    end = boundary > 0 ? boundary : text.search(/\s/);
  }
  if(end < 1) return withEllipsis(text);
  return withEllipsis(text.slice(0,end));
}

function renderTabAchievements(){
  var s = analyzeAll();
  var achievements = getDynamicAchievements(s);
  var ach = progress.achievements || {};
  var st = progress.streak || { current: 0, max: 0 };

  function achState(a){
    var val = Math.max(0, Number(a.getVal(s)) || 0);
    var unlocked = !!ach[a.id] || val >= a.max;
    var pct = a.max > 0 ? Math.min(100, Math.round((val / a.max) * 100)) : 0;
    return {val:val, unlocked:unlocked, pct:pct};
  }

  var unlockedTotal = achievements.reduce(function(n,a){ return n + (achState(a).unlocked ? 1 : 0); }, 0);
  var totalAchievements = achievements.length;
  var overallPct = totalAchievements ? Math.round(unlockedTotal / totalAchievements * 100) : 0;
  var activeDays = Object.keys(progress.activity || {}).filter(function(k){ return (progress.activity[k] || 0) > 0; }).length;

  var html = '';
  html += '<section class="home-section achiev-hero" data-flat="1">';
  html += '<div class="section-head-row"><div class="block"><div class="label">Conquistas</div><div class="title">Sua jornada</div><p class="desc">Acompanhe consistência, volume de questões e domínio do conteúdo em um só lugar.</p></div></div>';
  html += '<div class="achiev-overview-card">';
  html += '<div class="achiev-overview-main"><div><span class="achiev-overview-kicker">Progresso geral</span><strong class="achiev-overview-value">'+unlockedTotal+' <span>de '+totalAchievements+'</span></strong><span class="achiev-overview-caption">conquistas concluídas</span></div><div class="achiev-overview-ring" style="--p:'+overallPct+'"><span>'+overallPct+'%</span></div></div>';
  html += '<div class="achiev-overall-track"><span style="width:'+overallPct+'%"></span></div>';
  html += '<div class="achiev-summary-grid">';
  html += '<div class="achiev-summary-item"><span class="achiev-summary-label">Ofensiva atual</span><strong>'+st.current+' <small>dia'+(st.current===1?'':'s')+'</small></strong></div>';
  html += '<div class="achiev-summary-item"><span class="achiev-summary-label">Maior ofensiva</span><strong>'+st.max+' <small>dia'+(st.max===1?'':'s')+'</small></strong></div>';
  html += '<div class="achiev-summary-item"><span class="achiev-summary-label">Dias com atividade</span><strong>'+activeDays+' <small>dia'+(activeDays===1?'':'s')+'</small></strong></div>';
  html += '</div></div></section>';

  html += '<section class="home-section">';
  html += '<div class="section-head"><div><div class="label">Consistência</div><div class="title">Mapa de atividade</div></div><div class="action"><span class="achiev-section-meta">Últimos 12 meses</span></div></div>';
  html += '<div class="achiev-activity-panel">'+buildHeatmap()+'</div>';
  html += '</section>';

  function renderGroup(catId, title, subtitle, icon){
    var group = achievements.filter(function(a){ return a.cat === catId; });
    if(!group.length) return '';
    var states = group.map(achState);
    var done = states.filter(function(x){return x.unlocked;}).length;
    var nextIdx = -1;
    var bestPct = -1;
    states.forEach(function(x,i){ if(!x.unlocked && x.pct > bestPct){ bestPct=x.pct; nextIdx=i; } });

    var out = '<section class="home-section achiev-category">';
    out += '<div class="achiev-category-head"><div class="achiev-category-heading"><span class="achiev-category-icon" aria-hidden="true">'+icon+'</span><div><div class="label">Conquistas</div><div class="title">'+esc(title)+'</div><p>'+esc(subtitle)+'</p></div></div><div class="achiev-category-count"><strong>'+done+'/'+group.length+'</strong><span>concluídas</span></div></div>';
    out += '<div class="achiev-grid">';
    group.forEach(function(a,i){
      var x = states[i];
      var next = i === nextIdx;
      out += '<article class="achiev-card ' + (x.unlocked ? 'unlocked' : 'locked') + (next ? ' next' : '') + '">';
      out += '<div class="achiev-card-top"><div class="achiev-icon" aria-hidden="true">' + a.icon + '</div><span class="achiev-status '+(x.unlocked?'done':(next?'next':'pending'))+'">'+(x.unlocked?'Concluída':(next?'Mais próxima':'Em progresso'))+'</span></div>';
      out += '<div class="achiev-name">' + esc(a.name) + '</div><div class="achiev-desc">' + esc(a.desc) + '</div>';
      if(!x.unlocked){
        out += '<div class="achiev-card-progress"><div class="achiev-prog-label"><span>Progresso</span><strong>'+x.pct+'%</strong></div><div class="achiev-prog-wrap"><div class="achiev-prog-fill" style="width:' + x.pct + '%"></div></div><div class="achiev-prog-text"><strong>' + Math.min(x.val,a.max) + '</strong> de ' + a.max + '</div></div>';
      } else {
        out += '<div class="achiev-complete-line"><span aria-hidden="true">✓</span><strong>Meta alcançada</strong></div>';
      }
      out += '</article>';
    });
    out += '</div></section>';
    return out;
  }

  html += renderGroup('q', 'Resolução de questões', 'Marcos próximos no início e progressivamente mais exigentes conforme você avança.', '↗');
  html += renderGroup('m', 'Domínio do conteúdo', 'A dificuldade cresce gradualmente conforme mais questões são consolidadas.', '◆');
  html += renderGroup('s', 'Ofensiva', 'Sequências com intervalos progressivos: frequentes no começo e mais exigentes depois.', '🔥');
  return html;
}

        html += '<div class="content-theme"><div class="content-theme-head"><button class="content-toggle" data-haction="mgmt-toggle-theme" data-mat="'+escAttr(mat.m)+'" data-tema="'+escAttr(sec.t)+'" aria-expanded="'+(themeOpen?'true':'false')+'" style="transform:rotate('+(themeOpen?90:0)+'deg)">▶</button><div class="content-theme-main"><div class="content-theme-name">'+esc(sec.t)+'</div><div class="content-meta">'+tQ+' quest'+(tQ===1?'ão':'ões')+'</div></div><div class="content-row-actions"><button class="btn-icon-sm" data-haction="mgmt-rename-theme" data-mat="'+escAttr(mat.m)+'" data-tema="'+escAttr(sec.t)+'" title="Renomear tema">✎</button><button class="btn-icon-sm" data-haction="mgmt-move-theme" data-mat="'+escAttr(mat.m)+'" data-tema="'+escAttr(sec.t)+'" title="Mover tema">↦</button><button class="btn-icon-sm danger" data-haction="mgmt-delete-theme" data-mat="'+escAttr(mat.m)+'" data-tema="'+escAttr(sec.t)+'" title="Excluir tema">✕</button></div></div>';
        if(themeOpen){
          html += '<div class="content-question-list">';
          if(tQ===0) html += '<div class="content-meta" style="padding:8px 0;">Nenhuma questão neste tema.</div>';
          else (sec.q || []).forEach(function(q,qi){
            var preview=(q.st||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,110);
            html += '<div class="content-question-row"><span class="content-question-num">#'+(qi+1)+'</span><span class="content-question-preview" title="'+escAttr(preview)+'">'+esc(preview||'(sem enunciado)')+'</span><button class="btn-icon-sm" data-haction="mgmt-edit-question" data-mat="'+escAttr(mat.m)+'" data-tema="'+escAttr(sec.t)+'" data-qidx="'+qi+'" title="Editar questão">✎</button><button class="btn-icon-sm danger" data-haction="mgmt-delete-question" data-mat="'+escAttr(mat.m)+'" data-tema="'+escAttr(sec.t)+'" data-qidx="'+qi+'" title="Excluir questão">✕</button></div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
      if((mat.s||[]).length===0) html += '<div class="content-meta" style="padding:10px 0;">Nenhum tema nesta disciplina.</div>';
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div></section>';
  return html;
}

  html += '<div class="sync-mini-card"><div><div class="sync-mini-title">Sincronização automática</div><div class="sync-mini-desc">Envia alterações e busca atualizações periodicamente enquanto a plataforma está aberta.</div></div><button class="'+(syncOn?'btn-primary':'btn-secondary')+'" data-haction="toggle-sync-auto">'+(syncOn?'Ativada':'Ativar')+'</button></div>';
  html += '<div class="sync-mini-card"><div><div class="sync-mini-title">O que é sincronizado</div><div class="sync-mini-desc">Estado de estudo e preferências pessoais. O conteúdo do banco não é enviado.</div><div class="sync-scope-list"><span class="sync-scope-chip">Progresso</span><span class="sync-scope-chip">Revisões</span><span class="sync-scope-chip">Metas</span><span class="sync-scope-chip">Aparência</span><span class="sync-scope-chip">Conquistas</span></div></div></div>';
  html += '</div>';

  html += '<details class="settings-details" style="margin-top:18px;"><summary>Como configurar a sincronização com Google Drive + Apps Script</summary><div class="settings-details-body">';
  html += '<div class="drive-guide-lead"><strong>O Apps Script funciona como ponte entre o Hunter e um arquivo de progresso no seu Google Drive.</strong><br>O Hunter usa <code>GET</code> para buscar o progresso salvo e <code>POST</code> para gravar as alterações. Você não precisa criar o arquivo JSON manualmente: na primeira sincronização o script cria o arquivo automaticamente.</div>';

  html += '<div class="csv-guide-section"><div class="csv-guide-title">Passo a passo</div><div class="csv-rules">';
  html += '<div class="csv-rule"><span class="csv-rule-num">1</span><div><strong>Crie um projeto no Apps Script</strong><br>Acesse <a href="https://script.google.com/" target="_blank" rel="noopener noreferrer">script.google.com</a>, crie um novo projeto e apague o código inicial.</div></div>';
  html += '<div class="csv-rule"><span class="csv-rule-num">2</span><div><strong>Cole o script de sincronização</strong><br>Copie o código abaixo e cole no editor. O nome em <code>FILE_NAME</code> identifica o arquivo de progresso que ficará no Drive.</div></div>';
  html += '<div class="csv-rule"><span class="csv-rule-num">3</span><div><strong>Use um nome de arquivo exclusivo</strong><br>Para separar usuários, mantenha um <code>FILE_NAME</code> diferente para cada pessoa. Exemplo: <code>plataforma_estudos_progresso (Caio).json</code>.</div></div>';
  html += '<div class="csv-rule"><span class="csv-rule-num">4</span><div><strong>Publique como Aplicativo da Web</strong><br>Vá em <strong>Implantar → Nova implantação → Aplicativo da Web</strong>. Execute como <strong>você</strong> e selecione uma opção de acesso que permita abrir o Web App sem login. Autorize o acesso ao Drive.</div></div>';
  html += '<div class="csv-rule"><span class="csv-rule-num">5</span><div><strong>Copie a URL /exec</strong><br>Após implantar, copie a URL do Aplicativo da Web. Ela normalmente termina em <code>/exec</code>. Não use a URL do editor do Apps Script.</div></div>';
  html += '<div class="csv-rule"><span class="csv-rule-num">6</span><div><strong>Conecte no Hunter</strong><br>Cole a URL em <strong>URL de sincronização</strong>, clique em <strong>Salvar URL</strong>, depois em <strong>Testar</strong> e por fim em <strong>Sincronizar agora</strong>.</div></div>';
  html += '</div></div>';

  html += '<div class="csv-guide-section"><div class="csv-guide-title">Script de sincronização</div>';
  html += '<div class="drive-code-wrap"><div class="drive-code-head"><span class="drive-code-title">Apps Script — progresso do usuário</span><button class="btn-secondary" data-haction="copy-code" data-copy-target="sync-user-script">Copiar script</button></div>';
  html += `<pre class="csv-code-sample drive-code" id="sync-user-script">const FILE_NAME = &quot;plataforma_estudos_progresso (Caio).json&quot;;

function _findFile() {
  const it = DriveApp.getFilesByName(FILE_NAME);
  while (it.hasNext()) {
    const file = it.next();
    if (!file.isTrashed()) return file;
  }
  return null;
}

function doGet(e) {
  try {
    const file = _findFile();
    let data = {};
    if (file) {
      const content = file.getBlob().getDataAsString(&quot;UTF-8&quot;);
      data = content ? JSON.parse(content) : {};
    }
    return ContentService.createTextOutput(JSON.stringify(data))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ ok: false, error: String(err) }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    let payload = {};
    if (e &amp;&amp; e.postData &amp;&amp; e.postData.contents) {
      payload = JSON.parse(e.postData.contents);
    }
    const jsonStr = JSON.stringify(payload);
    const file = _findFile();
    if (file) {
      file.setContent(jsonStr);
    } else {
      DriveApp.createFile(FILE_NAME, jsonStr, MimeType.PLAIN_TEXT);
    }
    return ContentService.createTextOutput(JSON.stringify({ ok: true, timestamp: Date.now() }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ ok: false, error: String(err) }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}</pre></div>`;
  html += '<div class="drive-guide-note"><strong>Como funciona:</strong> <code>doGet()</code> localiza o arquivo pelo nome e devolve o progresso salvo. <code>doPost()</code> recebe o progresso enviado pelo Hunter e atualiza o arquivo; se ele ainda não existir, cria automaticamente no Google Drive.</div>';
  html += '<div class="csv-warning-box"><strong>Privacidade:</strong> trate a URL <code>/exec</code> como uma credencial de sincronização e não a compartilhe. O banco de questões não passa por este endpoint; ele é configurado separadamente em <strong>Conteúdo</strong>.</div></div>';

  html += '<div class="csv-guide-section"><div class="csv-guide-title">Como verificar se funcionou</div><div class="csv-rules">';
  html += '<div class="csv-rule"><span class="csv-rule-num">1</span><div><strong>Teste a URL</strong><br>Depois de salvar a URL no Hunter, clique em <strong>Testar</strong>. Uma instalação nova pode retornar um objeto vazio <code>{}</code>, o que é normal antes da primeira gravação.</div></div>';
  html += '<div class="csv-rule"><span class="csv-rule-num">2</span><div><strong>Faça a primeira sincronização</strong><br>Clique em <strong>Sincronizar agora</strong>. O Apps Script deverá criar o arquivo <code>plataforma_estudos_progresso (Caio).json</code> no seu Drive.</div></div>';
  html += '<div class="csv-rule"><span class="csv-rule-num">3</span><div><strong>Use em outro dispositivo</strong><br>No segundo dispositivo, abra a mesma plataforma e configure exatamente a mesma URL <code>/exec</code>. O progresso salvo poderá então ser reconciliado entre os dispositivos.</div></div>';
  html += '<div class="csv-rule"><span class="csv-rule-num">4</span><div><strong>Ao alterar o script</strong><br>Salve o código e atualize a implantação do Web App. Depois, teste novamente a conexão no Hunter.</div></div>';
  html += '</div></div>';
  html += '</div></details>';

  html += '</section>';
  return html;
}

      var mat = discSel.value; var temas = [];
      Object.keys(s.byTheme).forEach(function(k){ var tt = s.byTheme[k]; if(mat === '__all__' || tt.mat === mat){ if(temas.indexOf(tt.name) === -1) temas.push(tt.name); } });

        try {
          var imp = JSON.parse(evt.target.result);
          if(typeof imp !== 'object' || imp === null || Array.isArray(imp)) throw new Error('Estrutura inválida');
          // O backup importado passa a ser o estado local autoritativo.
          // Recria as revisoes de sync para impedir que um estado remoto antigo
          // sobrescreva silenciosamente a importacao logo apos o carregamento.
          progress = imp;
          if(!progress.settings || typeof progress.settings !== 'object') progress.settings = {};
          normalizePersistentSessions(progress);
          if(!progress.activity || typeof progress.activity !== 'object') progress.activity = {};
          if(!progress.achievements || typeof progress.achievements !== 'object') progress.achievements = {};
          delete progress._sync;
          syncBaseline = {};
          syncStamp();
          invalidateAnalyzeCache();
          applySettingsFromProgress();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
          renderHome();
          updateSyncStatusUI();
          alert('✅ Backup importado com sucesso.');
          // Se houver sincronizacao configurada, o proximo ciclo enviara o
          // backup importado para a nuvem em vez de substitui-lo pelo remoto.
        } catch(err){ alert('Erro: ' + (err.message || 'JSON inválido')); }
      };
      r.readAsText(file); importFile.value = '';
    });
  }

}

function createSessionObj(name, discs, themes, filter, reviewMode){

  for(var i=0;i<qs.length;i++){
    var art = qs[i]; var mat = art.getAttribute('data-mat'); var tema = art.getAttribute('data-tema');
    if(!noF){ var mD = aD.indexOf(mat) !== -1; var mT = aT.indexOf(mat + ':::' + tema) !== -1; if(!mD && !mT) continue; }
    var qid = art.getAttribute('data-qid'); var st = progress[qid]; var isM = false;
    if(reviewMode){ if(filter === 'overdue') isM = srIsOverdue(qid); else if(filter === 'today') isM = srIsToday(qid); else isM = srIsDue(qid); }

function normalizeHeader(h){ return String(h||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,' '); }
function detectColumns(headers){
  var map = {alts: {}, altImgs: {}};
  headers.forEach(function(h, i){
    var n = normalizeHeader(h); if(!n) return;
    if(/^(disciplina|materia|matéria|discipline|subject|categoria)$/.test(n)){ if(map.discipline === undefined) map.discipline = i; }
    else if(/^(tema|assunto|topico|tópico|theme|topic)$/.test(n)){ if(map.theme === undefined) map.theme = i; }
    else if(/^(enunciado|pergunta|statement|texto|descricao|question|questao)$/.test(n)){ if(map.statement === undefined) map.statement = i; }
    else if(/^(gabarito|resposta|correta|answer|resposta correta|correct|alternativa correta)$/.test(n)){ if(map.correct === undefined) map.correct = i; }
    else if(/^(explicacao|comentario|resolucao|justificativa|explanation|feedback|solucao)$/.test(n)){ if(map.explanation === undefined) map.explanation = i; }
    else if(/^(video|url do video|link do video|videourl|video url)$/.test(n)){ if(map.video === undefined) map.video = i; }
    else if(/^(imagem|image|foto|figura|picture|img)$/.test(n)){ if(map.image === undefined) map.image = i; }
    else {
      var mi = n.match(/^(?:imagem|image|foto|figura|img|pic|picture)\s*([a-e])$/) || n.match(/^(?:imagem|image|foto|figura|img|pic|picture)\s*(\d+)$/);
      if(mi){ var letter = /^\d+$/.test(mi[1]) ? String.fromCharCode(64 + parseInt(mi[1],10)) : mi[1].toUpperCase(); if(!map.altImgs[letter]) map.altImgs[letter] = i; return; }
      var m = n.match(/^(?:alternativa|alt|opcao|option|letra)\s*([a-f])$/) || n.match(/^([a-f])$/);
      if(m){ map.alts[m[1].toUpperCase()] = i; return; }
      var m2 = n.match(/^(?:alternativa|alt|opcao|option)\s*(\d+)$/);
      if(m2){ var num = parseInt(m2[1],10); if(num>=1 && num<=26){ map.alts[String.fromCharCode(64 + num)] = i; } }
    }

}
function extractImageSrc(raw){ var v = String(raw||'').trim(); if(!v) return ''; var m = v.match(/<img[^>]+src\s*=\s*["']([^"']+)["']/i); if(m) return m[1].trim(); return v; }
function rowsToQuestionRecords(rows){
  if(rows.length < 2) return [];
  var headers = rows[0];
  var map = detectColumns(headers);
  if(map.statement === undefined) throw new Error('Coluna "Enunciado" não encontrada.');
  if(map.correct === undefined) throw new Error('Coluna "Gabarito" não encontrada.');
  var altKeys = Object.keys(map.alts).sort();
  if(altKeys.length < 2) throw new Error('São necessárias pelo menos duas colunas de alternativas (A, B, C...).');
  var records = [];
  for(var r=1;r<rows.length;r++){
    var row = rows[r];
    var stmt = String(row[map.statement]||'').trim(); if(!stmt) continue;
    var correctLetter = String(row[map.correct]||'').trim().toUpperCase().replace(/[^A-F]/g,'').slice(0,1);
    if(!correctLetter || map.alts[correctLetter] === undefined) continue;
    var alts = altKeys.map(function(k){ return {letter:k, html:autoEmbedImageUrls(String(row[map.alts[k]]||'')), correct: k === correctLetter}; });
    var q = { i: makeQID(), n: 'Questão ' + String(records.length+1).padStart(3,'0'), st: autoEmbedImageUrls(stmt), a: alts };
    if(map.image !== undefined && row[map.image]){ var src = extractImageSrc(row[map.image]); if(src) q.st += '<img src="' + escAttr(src) + '" alt="" loading="lazy">'; }
    for(var ak in map.altImgs){
      if(!map.altImgs.hasOwnProperty(ak)) continue;
      var ai = map.altImgs[ak]; if(ai === undefined || row[ai] === undefined) continue;
      var src2 = extractImageSrc(row[ai]); if(!src2) continue;
      var altIdx = altKeys.indexOf(ak); if(altIdx >= 0) q.a[altIdx].img = src2;
    }
    if(map.explanation !== undefined && row[map.explanation]) q.d = String(row[map.explanation]).trim();
    if(map.video !== undefined && row[map.video]) q.v = String(row[map.video]).trim();
    records.push({
      q:q,
      mat: map.discipline !== undefined ? String(row[map.discipline]||'').trim() : '',
      tema: map.theme !== undefined ? String(row[map.theme]||'').trim() : ''
    });
  }
  return records;
}
function rowsToQuestions(rows){ return rowsToQuestionRecords(rows).map(function(rec){ return rec.q; }); }
function importCSVRecords(records){
  if(!records.length){ alert('Nenhuma questão válida encontrada. Verifique Enunciado, alternativas e Gabarito.'); return; }
  function commit(fallbackMat, fallbackTema){
    var imported = 0, groups = {};
    records.forEach(function(rec){
      var mat = rec.mat || fallbackMat || '';
      var tema = rec.tema || fallbackTema || '';
      if(!mat || !tema) return;
      addQuestionsToBank(mat, tema, [rec.q]); imported++;
      groups[mat + '\u0000' + tema] = true;
    });
    if(!imported){ alert('Nenhuma questão pôde ser importada porque faltou Disciplina ou Tema.'); return; }
    saveQuestions(); buildQuestionDOM(); renderHome();
    var groupCount = Object.keys(groups).length;
    var discSet = {};
    Object.keys(groups).forEach(function(k){ discSet[k.split('\u0000')[0]] = true; });
    alert('✅ ' + imported + ' questão' + (imported===1?'':'ões') + ' importada' + (imported===1?'':'s') + ' em ' + Object.keys(discSet).length + ' disciplina' + (Object.keys(discSet).length===1?'':'s') + ' e ' + groupCount + ' tema' + (groupCount===1?'':'s') + '.');
  }
  var missingScope = records.some(function(rec){ return !rec.mat || !rec.tema; });
  if(!missingScope){ commit('', ''); return; }
  var firstMat = '', firstTema = '';
  records.some(function(rec){ if(rec.mat){ firstMat=rec.mat; return true; } return false; });
  records.some(function(rec){ if(rec.tema){ firstTema=rec.tema; return true; } return false; });
  askImportInfo({mat:firstMat, tema:firstTema}, function(mat, tema){ commit(mat, tema); });
}

function addQuestionsToBank(mat, tema, questions){
  var matObj = DATA.find(function(x){ return x.m === mat; });
  if(!matObj){ matObj = {m: mat, s: []}; DATA.push(matObj); }
  if(!Array.isArray(matObj.s)) matObj.s = [];
  var temaObj = matObj.s.find(function(x){ return x.t === tema; });
  if(!temaObj){ temaObj = {t: tema, q: []}; matObj.s.push(temaObj); }
  if(!Array.isArray(temaObj.q)) temaObj.q = [];
  temaObj.q = temaObj.q.concat(questions);
}
function mergeBank(imported){
  var added = 0;
  imported.forEach(function(mat){
    if(!mat || !mat.m) return;
    var matObj = DATA.find(function(x){ return x.m === mat.m; });
    if(!matObj){ matObj = {m: mat.m, s: []}; DATA.push(matObj); }
    (mat.s||[]).forEach(function(sec){
      if(!sec || !sec.t) return;
      var temaObj = matObj.s.find(function(x){ return x.t === sec.t; });
      if(!temaObj){ temaObj = {t: sec.t, q: []}; matObj.s.push(temaObj); }
      (sec.q||[]).forEach(function(q){
        if(!q || !q.i) return;
        var exists = temaObj.q.some(function(ex){ return ex.i === q.i; });
        if(!exists){ temaObj.q.push(q); added++; }
      });
    });
  });
  return added;
}

function trapFocus(container){
  var prevFocus = document.activeElement;
  function handler(e){
    if(e.key !== 'Tab') return;
    var focusables = container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if(focusables.length === 0) return;
    var first = focusables[0], last = focusables[focusables.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  container.addEventListener('keydown', handler);
  return function release(){
    container.removeEventListener('keydown', handler);
    if(prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch(e){}
  };
}

}

function redistributeOverdue(mode){
  var ids = []; Object.keys(progress).forEach(function(qid){ if(srIsOverdue(qid)) ids.push(qid); });
  if(ids.length === 0){ alert('Nenhuma revisão atrasada.'); return; }
  var today0 = startOfToday();
  if(mode === 'today'){ ids.forEach(function(qid){ progress[qid].nextReview = today0 + Math.floor(Math.random() * DAY_MS); }); }
  else { var days = mode === 'spread7' ? 7 : 14; ids.forEach(function(qid, i){ var slot = Math.floor(i / ids.length * days); var jitter = Math.floor(Math.random() * DAY_MS); progress[qid].nextReview = today0 + (slot+1) * DAY_MS + jitter; }); }
  saveProgress(); invalidateAnalyzeCache(); alert(ids.length + ' revisões redistribuídas.'); renderHome();
}
function resetFiltered(){
  var dS = document.getElementById('reset-disc'), tS = document.getElementById('reset-tema'), sS = document.getElementById('reset-status');
  var mat = dS ? dS.value : '__all__', tema = tS ? tS.value : '__all__', status = sS ? sS.value : '__all__';
  var count = 0;
  Object.keys(progress).forEach(function(qid){
    if(qid === '_sync' || qid === 'settings' || qid === 'activity' || qid === 'achievements' || qid === 'streak' || qid === 'sessions') return;
    var art = qidMap.get(qid); if(!art) return;
    var m = art.getAttribute('data-mat'), t = art.getAttribute('data-tema');
    if(mat !== '__all__' && m !== mat) return; if(tema !== '__all__' && t !== tema) return;
    var st = progress[qid];
    if(status === 'wrong' && (!st || !st.answered || st.correct)) return;
    if(status === 'correct' && (!st || !st.answered || !st.correct)) return;
    if(status === 'dominated' && (!st || st.box !== -1)) return;
    if(status === 'unanswered' && st && st.answered) return;
    delete progress[qid]; count++;
  });
  saveProgress(); invalidateAnalyzeCache(); alert(count + ' questões resetadas.'); renderHome(); applyVisibility();
}

function renderUnifiedSheet(){
  var old = document.getElementById('unified-sheet'); if(old) old.remove();
  var discs = Object.keys(state.selDisc), temas = Object.keys(state.selTheme);
  if(discs.length === 0 && temas.length === 0) return;
  var s = analyzeAll();
  var stats = {unanswered:0, wrong:0, correct:0, total:0, today:0, overdue:0};
  var selD = discs.length > 0, selT = temas.length > 0;
  s.list.forEach(function(q){
    var okM = !selD || discs.indexOf(q.mat) !== -1;
    var okT = !selT || state.selTheme[q.mat + ':::' + q.tema];
    if(okM && okT){
      stats.total++;
      if(!q.st || !q.st.answered) stats.unanswered++;
      else { if(q.st.correct) stats.correct++; else stats.wrong++; if(srIsToday(q.qid)) stats.today++; if(srIsOverdue(q.qid)) stats.overdue++; }
    }
  });
  var title = '';
  if(discs.length === 1 && temas.length === 0) title = discs[0];
  else if(temas.length === 1 && discs.length === 0) title = temas[0].split(':::')[1];
  else title = (discs.length + temas.length) + ' itens selecionados';
  var revTotal = stats.today + stats.overdue;
  var sEl = document.createElement('div');
  sEl.id = 'unified-sheet';
  sEl.className = 'action-sheet';

function startFromSel(reviewMode, globalFilter){
  var discs = Object.keys(state.selDisc), temas = Object.keys(state.selTheme);
  if(discs.length === 0 && temas.length === 0) return;
  var mergeCb = document.getElementById('merge-themes-cb');
  var merge = mergeCb ? mergeCb.checked : true;
  var names = (temas.length > 0) ? temas.map(function(t){ return t.split(':::')[1]; }) : discs;
  var finalName = formatNames(names);
  var sess = createSessionObj(finalName, discs, temas, globalFilter, reviewMode);
  if(merge && (temas.length > 1 || discs.length > 0)){ shuffleArray(sess.qids); sess.isMixed = true; }
  if(!launchStudyFlow(sess)) alert('Nenhuma questão encontrada.');
}

.achiev-overview-value{display:block;font-family:var(--font-display);font-size:2rem;line-height:1.05;font-weight:600;color:var(--on-surface);font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.achiev-overview-value span{font-family:var(--font-body);font-size:.78rem;font-weight:600;color:var(--ink-subtle);letter-spacing:0}
.achiev-overview-caption{display:block;margin-top:5px;font-size:.78rem;color:var(--on-surface-variant)}
.achiev-overview-ring{--p:0;position:relative;width:72px;height:72px;flex:0 0 72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-container-high) 0)}
.achiev-overview-ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--paper-raised)}
.achiev-overview-ring span{position:relative;z-index:1;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--on-surface)}
.achiev-overall-track{height:5px;background:var(--surface-container-high);border-radius:99px;overflow:hidden;margin:21px 0 20px}
.achiev-overall-track>span{display:block;height:100%;background:var(--primary);border-radius:inherit;transition:width .3s ease}
.achiev-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);padding-top:18px}
.achiev-summary-item{padding:0 18px;border-right:1px solid var(--rule);min-width:0}
.achiev-summary-item:first-child{padding-left:0}.achiev-summary-item:last-child{border-right:0;padding-right:0}
.achiev-summary-label{display:block;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-subtle);margin-bottom:5px}
.achiev-summary-item strong{font-family:var(--font-display);font-size:1.28rem;font-weight:600;color:var(--on-surface);font-variant-numeric:tabular-nums}
.achiev-summary-item small{font-family:var(--font-body);font-size:.68rem;font-weight:500;color:var(--on-surface-variant)}

/* Mapa de atividade */
/* No modo escuro, cada célula precisa continuar legível mesmo quando não há atividade. */
:root[data-theme="dark"] .achiev-activity-panel .hm-cell{
  outline:1px solid color-mix(in srgb,var(--on-surface) 22%,transparent);
  outline-offset:-1px;
}
:root[data-theme="dark"] .achiev-activity-panel .hm-0{
  background:color-mix(in srgb,var(--on-surface) 10%,var(--surface));
}
:root[data-theme="dark"] .achiev-activity-panel .hm-1{
  background:color-mix(in srgb,var(--primary) 30%,var(--surface-container-high));
}
:root[data-theme="dark"] .achiev-activity-panel .hm-2{
  background:color-mix(in srgb,var(--primary) 50%,var(--surface-container-high));
}
:root[data-theme="dark"] .achiev-activity-panel .hm-3{
  background:color-mix(in srgb,var(--primary) 72%,var(--surface-container-high));
}
:root[data-theme="dark"] .achiev-activity-panel .hm-4{
  background:var(--primary);
}
.achiev-section-meta{display:inline-flex;align-items:center;min-height:28px;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-surface-variant);background:var(--surface-container)}
.achiev-activity-panel{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:20px 14px 16px;overflow:hidden}
.achiev-activity-panel .hm-scroll-container{padding:4px 2px 8px}

/* Categorias */
.achiev-category-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px}
.achiev-category-heading{display:flex;align-items:flex-start;gap:13px;min-width:0}
.achiev-category-heading .title{font-family:var(--font-display);font-size:1.35rem;font-weight:500;color:var(--on-surface);letter-spacing:-.015em;margin-top:3px}
.achiev-category-heading p{margin:5px 0 0;font-size:.82rem;line-height:1.5;color:var(--on-surface-variant)}
.achiev-category-icon{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;background:var(--primary-container);color:var(--on-primary-container);font-size:1rem;font-weight:700;border:1px solid var(--rule)}
.achiev-category-count{text-align:right;flex:0 0 auto}
.achiev-category-count strong{display:block;font-family:var(--font-display);font-size:1.18rem;line-height:1;font-weight:600;color:var(--on-surface);font-variant-numeric:tabular-nums}
.achiev-category-count span{display:block;margin-top:4px;font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--ink-subtle)}

.achiev-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:0}
.achiev-card{min-height:220px;background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:16px;text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;position:relative;overflow:hidden;transition:border-color .15s,background .15s,transform .15s;opacity:1;filter:none}
.achiev-card:hover{border-color:var(--rule-strong);transform:translateY(-1px)}
.achiev-card.locked{opacity:1;filter:none}
.achiev-card.unlocked{opacity:1;filter:none;border-color:color-mix(in srgb,var(--success) 55%,var(--rule));background:color-mix(in srgb,var(--success-container) 58%,var(--paper-raised))}
.achiev-card.next{border-color:color-mix(in srgb,var(--primary) 68%,var(--rule));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 12%,transparent)}
.achiev-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px}
.achiev-icon{width:40px;height:40px;margin:0;border-radius:10px;display:grid;place-items:center;font-size:1.45rem;line-height:1;background:var(--surface-container);border:1px solid var(--rule)}
.achiev-card.unlocked .achiev-icon{background:var(--success-container);border-color:color-mix(in srgb,var(--success) 45%,var(--rule))}
.achiev-status{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border-radius:999px;border:1px solid var(--rule);font-size:.57rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--ink-subtle);background:var(--surface)}
.achiev-status.done{color:var(--success);border-color:color-mix(in srgb,var(--success) 50%,var(--rule));background:var(--success-container)}
.achiev-status.next{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 48%,var(--rule));background:var(--primary-container)}
.achiev-name{font-family:var(--font-display);font-weight:600;font-size:1rem;margin:0 0 5px;color:var(--on-surface);line-height:1.25;letter-spacing:-.01em}
.achiev-desc{font-size:.75rem;color:var(--on-surface-variant);line-height:1.45;margin:0 0 16px;min-height:2.2em}
.achiev-card-progress{margin-top:auto}
.achiev-prog-label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:.61rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-subtle)}
.achiev-prog-label strong{font-size:.64rem;color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.achiev-prog-wrap{width:100%;height:5px;background:var(--surface-container-high);border-radius:99px;overflow:hidden}
.achiev-prog-fill{height:100%;background:var(--primary);border-radius:inherit;transition:width .3s}
.achiev-card.unlocked .achiev-prog-fill{background:var(--success)}
.achiev-prog-text{margin-top:7px;font-size:.66rem;font-weight:500;color:var(--on-surface-variant);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.achiev-prog-text strong{font-size:.75rem;color:var(--on-surface);font-weight:700}
.achiev-complete-line{display:flex;align-items:center;gap:7px;margin-top:auto;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--success) 28%,var(--rule));font-size:.7rem;color:var(--success)}
.achiev-complete-line span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--success);color:#fff;font-size:.66rem;font-weight:800}
.achiev-complete-line strong{font-weight:700}

@media(max-width:900px){
  .achiev-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  .achiev-overview-card{padding:19px 16px}
  .achiev-overview-main{gap:14px}
  .achiev-overview-ring{width:62px;height:62px;flex-basis:62px}
  .achiev-summary-grid{grid-template-columns:1fr;gap:12px}
  .achiev-summary-item,.achiev-summary-item:first-child,.achiev-summary-item:last-child{padding:0 0 12px;border-right:0;border-bottom:1px solid var(--rule)}
  .achiev-summary-item:last-child{padding-bottom:0;border-bottom:0}
  .achiev-category-head{align-items:flex-start;gap:12px}
  .achiev-category-heading{gap:10px}
  .achiev-category-heading p{font-size:.78rem}
  .achiev-category-count{padding-top:3px}
  .achiev-category-count span{display:none}
  .achiev-grid{grid-template-columns:1fr;gap:8px}
  .achiev-card{min-height:0;padding:15px}
  .achiev-desc{min-height:0}
  .achiev-activity-panel{padding-left:8px;padding-right:8px}
}
@media(hover:none){.achiev-card:hover{transform:none;border-color:var(--rule)}.achiev-card.unlocked:hover{border-color:color-mix(in srgb,var(--success) 55%,var(--rule))}.achiev-card.next:hover{border-color:color-mix(in srgb,var(--primary) 68%,var(--rule))}}
</style>

<style id="study-vertical-balance-v6">
/*
  Centraliza a questão na área realmente disponível entre as duas barras fixas.
  Se o cartão crescer além dessa área (resolução, imagens, texto longo), o main
  cresce normalmente e a página continua rolável, sem cortar o topo da questão.
*/
body.study-mode main.questions-container{
  --study-top-fixed:calc(62px + env(safe-area-inset-top,0px));
  --study-bottom-fixed:calc(60px + env(safe-area-inset-bottom,0px));
  --study-card-gap:24px;
  min-height:100dvh !important;
  margin:0 auto !important;
  padding-top:calc(var(--study-top-fixed) + var(--study-card-gap)) !important;
  padding-bottom:calc(var(--study-bottom-fixed) + var(--study-card-gap)) !important;
  display:flex !important;
  flex-direction:column !important;
  justify-content:center !important;
}
body.study-mode main.questions-container > .tema-section{
  width:100%;
  flex:0 0 auto;
}

@media(max-width:600px){

    --study-bottom-fixed:calc(58px + env(safe-area-inset-bottom,0px));

  }
}
</style>
